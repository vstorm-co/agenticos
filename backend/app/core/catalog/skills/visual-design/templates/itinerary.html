<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warsaw to Berlin</title>
  <link rel="stylesheet" href="lib/agenticos-2.css">
  <script src="lib/d3-7.9.0.min.js"></script>
  <script src="lib/topojson-client-3.1.0.min.js"></script>
  <script src="lib/world-atlas-2.0.2-110m.js"></script>
  <script src="lib/agenticos-worldmap-1.js"></script>
  <style>
    html, body { margin: 0; background: transparent; }
    .wrap { padding: 4px 0 8px; }
    #trip .aow-country { stroke: var(--ao-border-strong); }
    #trip .aow-country[data-hl] { fill: #8b6be8; fill-opacity: .35; }
    .stops button { font: inherit; color: var(--ao-fg); background: var(--ao-muted); border: 1px solid var(--ao-border-strong); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    .stops button:focus-visible { outline: 2px solid var(--ao-primary); outline-offset: 3px; }
    .stops { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="trip"></div>
    <ol id="stops" class="stops" aria-label="Stops"></ol>
  </main>
  <script>
    // Country outlines are context; these connecting lines are not driving directions.
    const stops = [
      { name: "Warsaw", lat: 52.2297, lng: 21.0122 },
      { name: "Poznań", lat: 52.4064, lng: 16.9252 },
      { name: "Berlin", lat: 52.5200, lng: 13.4050 },
    ];
    AOWorldMap.draw(document.getElementById("trip"), {
      focus: ["Poland", "Germany"],
      highlight: ["Poland", "Germany"],
      pins: stops,
      routes: stops.slice(1).map((stop, index) => ({ from: stops[index], to: stop })),
      label: "Warsaw to Berlin via Poznań",
    });
    for (const [index, stop] of stops.entries()) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `${index + 1}. ${stop.name}`;
      button.addEventListener("click", () => {
        agenticos.followUp(`Help me plan the stop in ${stop.name}.`);
      });
      item.appendChild(button);
      document.getElementById("stops").appendChild(item);
    }
  </script>
</body>
</html>
