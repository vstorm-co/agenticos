<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product analytics - 15-21 Sep 2026</title>
  <link rel="stylesheet" href="lib/agenticos-4.css">
  <script src="lib/chart-4.5.1.umd.min.js"></script>
  <script src="lib/lucide-1.46.0.min.js"></script>
  <script src="lib/agenticos-4.js"></script>
</head>
<body>
  <main class="ao-page">
    <header class="ao-header">
      <div>
        <div class="ao-eyebrow"><i data-lucide="chart-no-axes-column"></i><span id="eyebrow"></span></div>
        <h1 id="title"></h1>
        <p class="ao-subtitle" id="subtitle"></p>
        <div class="ao-meta">
          <span><i data-lucide="calendar"></i><span id="period"></span></span>
          <span><i data-lucide="database"></i><span id="source"></span></span>
        </div>
      </div>
      <div class="ao-header-actions">
        <span class="ao-chip ao-chip-dot ao-chip-warning">Synthetic example data</span>
      </div>
    </header>

    <section class="ao-grid-4" id="stats" aria-label="Key numbers"></section>

    <div class="ao-stack">
    <section class="ao-section" data-ao-tabs-scope>
      <div class="ao-section-header">
        <div>
          <h2 class="ao-section-title"><i data-lucide="trending-up"></i><span id="chart-title"></span></h2>
          <p class="ao-section-desc" id="chart-desc"></p>
        </div>
        <div class="ao-tabs ao-tabs-line" data-ao-tabs aria-label="Metric">
          <button class="ao-tab" data-ao-tab="active" aria-selected="true">Active users</button>
          <button class="ao-tab" data-ao-tab="signups">Sign-ups</button>
        </div>
      </div>
      <div class="ao-card">
        <div class="ao-chart" data-ao-panel="active"><canvas id="active-chart" role="img" aria-label="Active users by day, this week against the week before"></canvas></div>
        <div class="ao-chart" data-ao-panel="signups" hidden><canvas id="signups-chart" role="img" aria-label="Sign-ups by day, this week against the week before"></canvas></div>
      </div>
    </section>

    <section class="ao-grid-2">
      <article class="ao-card">
        <div class="ao-card-header">
          <h2 class="ao-card-title" id="goals-title"></h2>
        </div>
        <div class="ao-stack" id="goals"></div>
      </article>
      <article class="ao-card ao-card-flush">
        <div class="ao-card-header">
          <h2 class="ao-card-title" id="table-title"></h2>
        </div>
        <div class="ao-table-wrap">
          <table class="ao-table" id="table"></table>
        </div>
      </article>
    </section>
    </div>

    <footer class="ao-footer">
      <span><i data-lucide="info"></i><span id="note"></span></span>
    </footer>
  </main>

  <script>
    // Replace this object; nothing below it needs to change. Numbers stay numbers
    // here - the page formats them for the reader's language.
    const data = {
      eyebrow: "Product",
      title: "Product analytics - week of 15 Sep 2026",
      subtitle: "Active use is up for the third week running; trial conversion is the one number below goal.",
      period: "15-21 Sep 2026",
      source: "Synthetic event sample, not a real export",
      stats: [
        // `better` says which direction is good, so a rise in churn is red.
        { icon: "users", tone: "", label: "Active users", value: 18420, change: 0.074, percent: true, better: "up", foot: "vs the week before" },
        { icon: "user-plus", tone: "success", label: "New sign-ups", value: 1260, change: 0.032, percent: true, better: "up", foot: "vs the week before" },
        { icon: "timer", tone: "warning", label: "Median session", value: 7.4, unit: " min", change: -0.3, better: "up", foot: "vs the week before" },
        { icon: "user-minus", tone: "danger", label: "Churned accounts", value: 41, change: 6, better: "down", foot: "vs the week before" },
      ],
      chart: {
        title: "By day",
        desc: "This week against the week before.",
        labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
        active: { now: [2810, 3120, 3090, 3260, 3010, 1720, 1410], before: [2640, 2890, 2950, 3010, 2860, 1690, 1380] },
        signups: { now: [188, 214, 207, 221, 196, 131, 103], before: [181, 198, 204, 209, 190, 128, 104] },
      },
      goals: {
        title: "Goals for the week",
        rows: [
          { label: "Weekly active users", now: 18420, goal: 18000, unit: "", tone: "success" },
          { label: "Trial to paid conversion", now: 0.186, goal: 0.22, percent: true, tone: "warning" },
          { label: "Onboarding completed", now: 0.71, goal: 0.7, percent: true, tone: "success" },
        ],
      },
      table: {
        title: "Most active teams",
        columns: [{ label: "Team" }, { label: "Seats", numeric: true }, { label: "Sessions", numeric: true }, { label: "Health" }],
        rows: [
          ["Northwind Studio", 42, 1180, { badge: "Growing", tone: "success" }],
          ["Contoso Labs", 31, 904, { badge: "Steady", tone: "info" }],
          ["Fabrikam Ops", 27, 611, { badge: "At risk", tone: "danger" }],
          ["Tailspin Group", 19, 487, { badge: "Steady", tone: "info" }],
        ],
      },
      note: "Churn counts an account on the day its last seat was removed, not the day it stopped using the product.",
    };

    const { format } = AO;
    const text = (id, value) => (document.getElementById(id).textContent = value);

    document.title = data.title;
    for (const key of ["eyebrow", "title", "subtitle", "period", "source", "note"]) text(key, data[key]);
    text("chart-title", data.chart.title);
    text("chart-desc", data.chart.desc);
    text("goals-title", data.goals.title);
    text("table-title", data.table.title);

    const stats = document.getElementById("stats");
    for (const stat of data.stats) {
      const good = stat.change === 0 ? "" : (stat.change > 0) === (stat.better === "up") ? "ao-up" : "ao-down";
      const arrow = stat.change > 0 ? "arrow-up-right" : stat.change < 0 ? "arrow-down-right" : "minus";
      const tile = document.createElement("article");
      tile.className = "ao-card ao-stat-tile";
      tile.innerHTML = `
        <span class="ao-stat-icon${stat.tone ? " ao-stat-icon-" + stat.tone : ""}"><i data-lucide="${stat.icon}"></i></span>
        <div class="ao-stat">
          <div class="ao-stat-label"></div>
          <div class="ao-stat-value"></div>
          <div class="ao-stat-foot"><span class="ao-delta ${good}"><i data-lucide="${arrow}"></i><span></span></span><span></span></div>
        </div>`;
      tile.querySelector(".ao-stat-label").textContent = stat.label;
      tile.querySelector(".ao-stat-value").textContent = format.number(stat.value) + (stat.unit || "");
      tile.querySelector(".ao-delta span").textContent = format.delta(stat.change, { percent: stat.percent });
      tile.querySelector(".ao-stat-foot > span:last-child").textContent = stat.foot;
      stats.append(tile);
    }

    const comparison = (series) => () => ({
      type: "line",
      data: {
        labels: data.chart.labels,
        datasets: [
          { label: "This week", data: series.now, borderColor: AO.color("--ao-series-1"), backgroundColor: AO.color("--ao-series-1"), tension: 0.3 },
          { label: "Week before", data: series.before, borderColor: AO.color("--ao-series-3"), backgroundColor: AO.color("--ao-series-3"), tension: 0.3, borderDash: [5, 4] },
        ],
      },
    });
    AO.chart("#active-chart", comparison(data.chart.active));
    AO.chart("#signups-chart", comparison(data.chart.signups));

    const goals = document.getElementById("goals");
    for (const goal of data.goals.rows) {
      const share = Math.min(goal.now / goal.goal, 1);
      const shown = (value) => (goal.percent ? format.percent(value, 1) : format.number(value));
      const row = document.createElement("div");
      row.innerHTML = `<div class="ao-progress-label"><span></span><span></span></div>
        <div class="ao-progress ao-progress-${goal.tone}"><span></span></div>`;
      const labels = row.querySelectorAll(".ao-progress-label span");
      labels[0].textContent = goal.label;
      labels[1].textContent = shown(goal.now) + " of " + shown(goal.goal);
      row.querySelector(".ao-progress > span").style.width = share * 100 + "%";
      goals.append(row);
    }

    const table = document.getElementById("table");
    const head = table.createTHead().insertRow();
    for (const column of data.table.columns) {
      const th = document.createElement("th");
      th.textContent = column.label;
      if (column.numeric) th.className = "ao-num";
      head.append(th);
    }
    const body = table.createTBody();
    for (const row of data.table.rows) {
      const tr = body.insertRow();
      row.forEach((value, i) => {
        const column = data.table.columns[i];
        const td = tr.insertCell();
        if (value && typeof value === "object") {
          const badge = document.createElement("span");
          badge.className = "ao-badge ao-badge-" + value.tone;
          badge.textContent = value.badge;
          td.append(badge);
        } else if (column.numeric) {
          td.className = "ao-num";
          td.textContent = format.number(value);
        } else {
          td.className = "ao-strong";
          const who = AO.initials(value);
          const mark = document.createElement("span");
          mark.className = "ao-initials ao-initials-sm ao-initials-" + who.tone;
          mark.textContent = who.text;
          mark.setAttribute("aria-hidden", "true");
          const wrap = document.createElement("span");
          wrap.className = "ao-row";
          const name = document.createElement("span");
          name.textContent = value;
          wrap.append(mark, name);
          td.append(wrap);
        }
      });
    }
  </script>
</body>
</html>
