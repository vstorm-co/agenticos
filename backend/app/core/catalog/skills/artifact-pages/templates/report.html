<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support response times - Q3 2026</title>
  <link rel="stylesheet" href="lib/agenticos-4.css">
  <script src="lib/chart-4.5.1.umd.min.js"></script>
  <script src="lib/lucide-1.46.0.min.js"></script>
  <script src="lib/agenticos-4.js"></script>
</head>
<body>
  <main class="ao-page">
    <header class="ao-header">
      <div>
        <div class="ao-eyebrow"><i data-lucide="file-text"></i><span id="eyebrow"></span></div>
        <h1 id="title"></h1>
        <p class="ao-subtitle" id="subtitle"></p>
        <div class="ao-meta">
          <span><i data-lucide="calendar"></i><span id="period"></span></span>
          <span><i data-lucide="database"></i><span id="source"></span></span>
        </div>
      </div>
      <div class="ao-header-actions">
        <span class="ao-chip ao-chip-dot ao-chip-warning">Synthetic example data</span>
      </div>
    </header>

    <div class="ao-stack">
      <div class="ao-callout ao-callout-success" role="note">
        <i data-lucide="circle-check"></i>
        <div id="answer"></div>
      </div>
      <section class="ao-grid-3" id="facts" aria-label="Key facts"></section>
    </div>

    <section class="ao-section">
      <div class="ao-section-header">
        <div>
          <h2 class="ao-section-title"><i data-lucide="line-chart"></i><span id="chart-title"></span></h2>
          <p class="ao-section-desc" id="chart-desc"></p>
        </div>
      </div>
      <div class="ao-card">
        <div class="ao-chart"><canvas id="chart" role="img" aria-label="Median first response time by month against the target"></canvas></div>
      </div>
    </section>

    <section class="ao-section">
      <div class="ao-section-header">
        <div>
          <h2 class="ao-section-title"><i data-lucide="layers"></i><span id="table-title"></span></h2>
          <p class="ao-section-desc" id="table-desc"></p>
        </div>
      </div>
      <div class="ao-card ao-card-flush">
        <div class="ao-table-wrap">
          <table class="ao-table" id="table"></table>
        </div>
      </div>
    </section>

    <section class="ao-section">
      <div class="ao-section-header">
        <h2 class="ao-section-title"><i data-lucide="list-checks"></i>Next steps</h2>
      </div>
      <ul class="ao-list" id="steps"></ul>
    </section>

    <footer class="ao-footer">
      <span><i data-lucide="info"></i><span id="note"></span></span>
    </footer>
  </main>

  <script>
    // Replace this object; nothing below it needs to change. Numbers stay numbers
    // here - the page formats them for the reader's language.
    const data = {
      eyebrow: "Quarterly report",
      title: "Support response times - Q3 2026",
      subtitle: "First replies got faster every month; the slowest queue is the only one still over target.",
      period: "1 Jul - 30 Sep 2026",
      source: "Synthetic ticket sample, not a real export",
      answer: "The median first response is 3.4 hours, 0.9 hours inside the 4-hour target, and 22% faster than last quarter.",
      facts: [
        { label: "Median first response", value: 3.4, unit: " h", change: -0.22, percent: true, better: "down", foot: "vs Q2" },
        { label: "Tickets handled", value: 9840, change: 0.081, percent: true, better: "up", foot: "vs Q2" },
        { label: "Answered within target", value: 0.91, percent: true, change: 0.04, better: "up", foot: "points vs Q2" },
      ],
      chart: {
        title: "Median first response by month",
        desc: "Hours, against the 4-hour target.",
        labels: ["Jul", "Aug", "Sep"],
        values: [4.1, 3.4, 2.8],
        target: 4,
      },
      table: {
        title: "By queue",
        desc: "Billing is the one queue over target.",
        columns: [{ label: "Queue" }, { label: "Tickets", numeric: true }, { label: "Median (h)", numeric: true, digits: 1 }, { label: "Status" }],
        rows: [
          ["Billing", 2210, 4.6, { badge: "Over target", tone: "danger" }],
          ["Account access", 1980, 3.1, { badge: "On target", tone: "success" }],
          ["Bug reports", 3120, 3.0, { badge: "On target", tone: "success" }],
          ["How-to questions", 2530, 2.9, { badge: "On target", tone: "success" }],
        ],
      },
      steps: [
        { icon: "user-plus", text: "Move two agents from how-to questions to billing for October." },
        { icon: "book-open", text: "Write macros for the five most common billing questions." },
        { icon: "gauge", text: "Report the billing median again at the end of October." },
      ],
      note: "A reply counts as the first response only when a person wrote it; automatic acknowledgements are excluded.",
    };

    const { format } = AO;
    const text = (id, value) => (document.getElementById(id).textContent = value);

    document.title = data.title;
    for (const key of ["eyebrow", "title", "subtitle", "period", "source", "answer", "note"]) text(key, data[key]);
    text("chart-title", data.chart.title);
    text("chart-desc", data.chart.desc);
    text("table-title", data.table.title);
    text("table-desc", data.table.desc);

    const facts = document.getElementById("facts");
    for (const fact of data.facts) {
      const good = fact.change === 0 ? "" : (fact.change > 0) === (fact.better === "up") ? "ao-up" : "ao-down";
      const arrow = fact.change > 0 ? "arrow-up-right" : fact.change < 0 ? "arrow-down-right" : "minus";
      const card = document.createElement("article");
      card.className = "ao-card ao-stat";
      card.innerHTML = `
        <div class="ao-stat-label"></div>
        <div class="ao-stat-value"></div>
        <div class="ao-stat-foot"><span class="ao-delta ${good}"><i data-lucide="${arrow}"></i><span></span></span><span></span></div>`;
      card.querySelector(".ao-stat-label").textContent = fact.label;
      card.querySelector(".ao-stat-value").textContent = (fact.percent && fact.value <= 1 ? format.percent(fact.value, 0) : format.number(fact.value)) + (fact.unit || "");
      card.querySelector(".ao-delta span").textContent = format.delta(fact.change, { percent: true });
      card.querySelector(".ao-stat-foot > span:last-child").textContent = fact.foot;
      facts.append(card);
    }

    AO.chart("#chart", () => ({
      type: "bar",
      data: {
        labels: data.chart.labels,
        datasets: [
          { type: "bar", label: "Median first response (h)", data: data.chart.values, backgroundColor: AO.color("--ao-series-1") },
          {
            type: "line",
            label: "Target (h)",
            data: data.chart.labels.map(() => data.chart.target),
            borderColor: AO.color("--ao-series-3"),
            backgroundColor: AO.color("--ao-series-3"),
            borderDash: [5, 4],
            pointRadius: 0,
          },
        ],
      },
    }));

    const table = document.getElementById("table");
    const head = table.createTHead().insertRow();
    for (const column of data.table.columns) {
      const th = document.createElement("th");
      th.textContent = column.label;
      if (column.numeric) th.className = "ao-num";
      head.append(th);
    }
    const body = table.createTBody();
    for (const row of data.table.rows) {
      const tr = body.insertRow();
      row.forEach((value, i) => {
        const column = data.table.columns[i];
        const td = tr.insertCell();
        if (value && typeof value === "object") {
          const badge = document.createElement("span");
          badge.className = "ao-badge ao-badge-" + value.tone;
          badge.textContent = value.badge;
          td.append(badge);
        } else if (column.numeric) {
          td.className = "ao-num";
          td.textContent = format.number(value, { minimumFractionDigits: column.digits || 0 });
        } else {
          td.className = "ao-strong";
          td.textContent = value;
        }
      });
    }

    const steps = document.getElementById("steps");
    for (const step of data.steps) {
      const item = document.createElement("li");
      item.className = "ao-row";
      item.innerHTML = '<i data-lucide=""></i><span></span>';
      item.querySelector("i").setAttribute("data-lucide", step.icon);
      item.querySelector("span").textContent = step.text;
      steps.append(item);
    }
  </script>
</body>
</html>
