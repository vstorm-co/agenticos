<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open tickets</title>
  <link rel="stylesheet" href="lib/agenticos-4.css">
  <script src="lib/lucide-1.46.0.min.js"></script>
  <script src="lib/agenticos-4.js"></script>
</head>
<body>
  <!--
    Bound to one saved view, published with
      bindings: {"tickets": {"view": "<view id>", "fields": {"title": "Title",
                 "status": "Status", "assignee": "Assignee", "opened": "Opened"}}}
    The records are read each time somebody opens the page, as that person.
    Change the binding name, the text and the badge tones; leave the drawing
    to AO.records. The chips filter the records already loaded; they do not
    write anything back.
  -->
  <main class="ao-page">
    <header class="ao-header">
      <div>
        <div class="ao-eyebrow"><i data-lucide="ticket"></i>Support</div>
        <h1>Open tickets</h1>
        <p class="ao-subtitle">Everything the support queue has not closed yet, newest first.</p>
        <div class="ao-meta">
          <span class="ao-live">Live</span>
          <span><i data-lucide="database"></i>Tickets table, the Open view</span>
        </div>
      </div>
    </header>

    <section class="ao-section">
      <div class="ao-section-header">
        <div>
          <h2 class="ao-section-title"><i data-lucide="list"></i>Tickets</h2>
          <p class="ao-section-desc" id="count" aria-live="polite"></p>
        </div>
      </div>
      <div class="ao-toolbar" role="group" aria-label="Filter by status">
        <button type="button" class="ao-chip" data-status="" aria-pressed="true">All</button>
        <button type="button" class="ao-chip ao-chip-dot ao-chip-warning" data-status="Open" aria-pressed="false">Open</button>
        <button type="button" class="ao-chip ao-chip-dot ao-chip-accent" data-status="In progress" aria-pressed="false">In progress</button>
        <button type="button" class="ao-chip ao-chip-dot ao-chip-danger" data-status="Blocked" aria-pressed="false">Blocked</button>
      </div>
      <div class="ao-card ao-card-flush">
        <!-- AO.records draws the table, or the loading, empty and unavailable states, in here. -->
        <div id="tickets"></div>
      </div>
    </section>

    <footer class="ao-footer">
      <span><i data-lucide="info"></i>Refresh in the viewer to read the records again.</span>
    </footer>
  </main>

  <script>
    // The words the states use, in the page's language.
    const text = {
      loading: "Loading tickets…",
      unavailable: "These tickets are not available to you.",
      empty: "No tickets match.",
      truncated: "Showing the first {count} tickets.",
    };
    // Badge tone by field, then by value.
    const badges = { status: { Open: "warning", "In progress": "info", Blocked: "danger" } };
    const columns = ["title", "status", "assignee", "opened"];

    let loaded = null;
    let status = "";

    function draw() {
      if (!loaded || loaded.status !== "ok") {
        AO.records("#tickets", loaded, { columns, badges, text });
        document.getElementById("count").textContent = "";
        return;
      }
      const shown = status ? loaded.records.filter((record) => record.status === status) : loaded.records;
      AO.records("#tickets", { ...loaded, records: shown, count: shown.length }, { columns, badges, text });
      document.getElementById("count").textContent = AO.format.number(shown.length) + (status ? " " + status.toLowerCase() : " open");
    }

    for (const chip of document.querySelectorAll("[data-status]")) {
      chip.addEventListener("click", () => {
        status = chip.dataset.status;
        for (const other of document.querySelectorAll("[data-status]")) {
          other.setAttribute("aria-pressed", String(other === chip));
        }
        draw();
      });
    }

    // Until the first data arrives, a loading line.
    draw();

    agenticos.onData(function (data) {
      loaded = data.tickets;
      draw();
    });
  </script>
</body>
</html>
