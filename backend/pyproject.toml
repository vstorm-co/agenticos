[project]
name = "agenticos"
version = "0.0.215"
description = "OS for your agents."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "DEENUU1", email = "kacper.wlodarczyk@vstorm.co" },
]

dependencies = [
    # Uncapped on purpose. FastAPI, Pydantic AI, Logfire and genai-prices track
    # the newest release: this platform's whole subject matter moves at their
    # pace, and genai-prices in particular *is* the model price snapshot, so an
    # old one means budgets computed from stale prices. `make deps-upgrade`
    # bumps them, the `dependency-freshness` workflow tries the newest of
    # everything on a schedule, and Dependabot opens the PR. A cap here (it was
    # `<0.137`) turns all three into no-ops.
    # The floor is a correctness floor, not a taste one: `Depends(..., scope=)`
    # is what makes the request's transaction commit before the response is sent
    # (#353), and an older FastAPI answers `TypeError` at import rather than
    # quietly reverting - but only 0.141.1 has been run against this suite.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "logfire[fastapi,asyncpg,redis,httpx]>=4.40.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    # Alembic's, not the application's. Every application URL is
    # `postgresql+asyncpg`, so this reads as dead to a grep - but `alembic/env.py`
    # builds a *sync* engine from `DATABASE_URL_SYNC`, which is bare
    # `postgresql://`, and SQLAlchemy resolves that to psycopg2. Removing it
    # breaks every migration (#155).
    "psycopg2-binary>=2.9.0",
    "alembic>=1.19.1",
    "greenlet>=3.5.5",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "authlib>=1.3.0",
    # Imported at module scope in `app/services/rag_document.py`, and until #155
    # declared only in the `dev` group - so `uv sync --no-dev`, which is what the
    # image builds with, was relying on Starlette to pull it in.
    "anyio>=4.14.2",
    "redis>=8.1.0",
    "aiosmtplib>=3.0.0",
    # Starlette's requirement for `SessionMiddleware`, which `main.py` adds for
    # the OAuth handshake. Declared here rather than left transitive because the
    # middleware is ours: Starlette itself installs without it (#155).
    "itsdangerous>=2.2.0",
    "prefect>=3.8.3",
    # The floor is `pydantic-ai-harness`'s, not ours - nothing here needs a
    # feature of any particular release, and stating it is what keeps a resolver
    # from picking a slim the harness cannot run on. Dependabot raises it to
    # whatever is current, which is fine as long as the lock resolves to at least
    # as new: this group's bump once locked 2.30.0 while `main` already held
    # 2.31.0, and the image installs the lock verbatim (`uv sync --frozen`).
    "pydantic-ai-slim[openrouter,anthropic,google,duckduckgo,web-fetch,groq,mistral,cohere,huggingface,xai]>=2.30.0",
    "genai-prices>=0.1.2",
    "pydantic-ai-slim[mcp]>=2.30.0",
    # Wrapped by three capabilities: `guardrails` (the ready-made secret/PII
    # detectors and the input/output/tool guard edges), `planning` (the plan
    # store, tools and cache-safe tail reminder) and `compaction` (the
    # context-window handling and its strategies). Uncapped for the same reason
    # Pydantic AI is: this is where those are maintained, and pinning would
    # freeze the detectors and the model registry they read. 0.21.0 is the floor
    # all three were written against.
    "pydantic-ai-harness>=0.21.0",
    "websockets>=15.0",
    # Required, not optional: hybrid retrieval fuses BM25 with the vector search
    # and a deployment cannot choose otherwise. It is also the only reason
    # `numpy` (24 MB) is installed - a real cost, taken deliberately (#155).
    "rank-bm25>=0.2.2",
    "pymupdf>=1.28.2",
    # `app/services/channels/chart_png.py` renders a chart tool's output for a
    # channel that cannot show HTML. A transitive of the parsers as well, but the
    # direct use is ours.
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "llama-cloud>=2.14.0",
    "liteparse>=2.12.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.56.3",
    "boto3>=1.43.72",
    "httpx>=0.28.0",
    "click>=8.1.0",
    # `cli/commands.py` renders every list the CLI prints. It has no import site
    # under `app/`, which is how it was briefly deleted as dead (#155) - the
    # `deptry` step reads `cli/` as well for exactly that reason.
    "tabulate>=0.9.0",
    "tqdm>=4.70.0",
    "tavily-python>=0.7.27",
    "pydantic-monty>=0.0.21",
    "pydantic-ai-skills>=0.11.0",
    # `console` for the toolset, `remote` for the sandboxd client. Deliberately
    # not `docker`: this container never touches the socket, so the Docker SDK
    # has no business in the image. The service runs beside us as `sandboxd`.
    # Floors at 0.2.26 for `FileInfo.modified_at`, which the listings carry to
    # the file viewer (#500).
    "pydantic-ai-backend[console,remote]>=0.2.26",
    # Delegation. Floors at 0.2.16 for three fixes this integration depends on:
    # a suspended child no longer reported to the parent as completed (#64),
    # `event_stream_handler_factory` on the toolset so a fan-out's events can be
    # labelled per delegation (#65), and a bounded wait in `cancel_all`'s
    # `finally` so a child that swallows cancellation cannot hang our teardown
    # (#66).
    # 0.2.17 first carried the caller-supplied-subagent ask_parent fix a sync
    # delegate needs to reach the person waiting on its parent
    # (subagents-pydantic-ai#76); 0.2.18 also fixes the general-purpose delegate
    # (#78). 0.2.19 adds `TaskHandle.exception`, which is what keeps a provider's
    # own text off a delegated run's row (#699). 0.2.20 reads that field in
    # `check_task` and `wait_tasks` themselves, so a status answer names the
    # exception's class rather than embedding the provider's message - the one
    # surface `tool_retry_notice` cannot reach, because a `ToolReturnPart` is
    # stored whole (#819). The floor is 0.2.20.
    "subagents-pydantic-ai>=0.2.20",
    "cryptography>=50.0.0",
    "aiogram>=3.17,<4.0",
    "slack-sdk>=3.35.0",
]

# No `[project.optional-dependencies]` entry for the `browser_use` capability's
# engine. `browser-use` (0.13.x) hard-pins `pydantic==2.12.5`, which is
# irreconcilable with this project's `pydantic>=2.13.4`: uv's universal resolver
# refuses to lock even an *optional* extra whose transitive pins conflict with the
# base ones. So it cannot be a managed dependency here at all, and installing it
# into the venv would drag `pydantic` back a minor across the whole platform.
# Until browser-use loosens that pin, the capability is wired and tested but its
# engine is not co-installable - see the capability's README and docs/reference.

# PEP 735 dependency group — installed by `uv sync` / `uv sync --dev` and
# excluded by `--no-dev`. (A `dev` extra under [project.optional-dependencies]
# only installed via uv's deprecated dev-extra special-casing, so `uv sync --dev`
# could skip it on some uv versions and leave pre-commit/ruff/ty unspawnable.)
[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "anyio[trio]>=4.14.2",
    "pytest-cov>=6.1.0",
    "httpx>=0.28.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "pre-commit>=4.6.2",
    "pytest-xdist>=3.8.0",
    # Shuffles the suite every run and prints the seed, so an order-dependent
    # test fails here rather than months later in an unrelated pull request.
    # It carries its own xdist support (the controller's seed is handed to each
    # worker through `workerinput`), without which the workers would collect in
    # four different orders and `-n auto` would abort on the mismatch.
    "pytest-randomly>=4.1.0",
    "vulture>=2.14",
    # vulture reads the code and finds what is written but unused; deptry reads
    # the manifest and finds what is declared but unimported. Nothing noticed
    # `fastapi-cache2` or `jinja2` going dead, which is the half of #155 worth
    # more than the megabytes it recovered.
    "deptry>=0.23.0",
]
# The documentation site. Its own group rather than part of `dev`, because the
# reference pages import the application to read its docstrings - so this group
# needs the runtime installed, and CI's lint job does not need mkdocs.
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=1.0.6",
]

[project.scripts]
agenticos = "cli.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

# Dead-code detection. Two modes share this config:
#   `make lint` runs `vulture` at the default confidence below - a blocking gate,
#   but only on what vulture is sure of (unused variables, parameters, imports).
#   Unused *functions and methods* sit at 60% confidence here because the
#   codebase is registry-driven: FastAPI route handlers, Pydantic validators and
#   capability-protocol methods are all called by name from a framework vulture
#   cannot see, so a blocking function-level gate would be false positives all
#   the way down. `make dead-code` lowers the confidence to 60 for a periodic,
#   human-read scan instead - the same role `dependency-freshness` plays.
# `ignore_decorators` removes the framework false positives from both modes;
# `ignore_names` is the allowlist for anything left that is reachable in a way
# vulture cannot follow - add `name  # why` when a real false positive appears.
[tool.vulture]
paths = ["app"]
min_confidence = 80
ignore_decorators = [
    "@field_validator",
    "@model_validator",
    "@field_serializer",
    "@model_serializer",
    "@computed_field",
    "@router.*",
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.patch",
    "@*.delete",
    "@*.websocket",
]
ignore_names = []

# The other half of vulture: vulture finds code nothing calls, deptry finds a
# distribution nothing imports. DEP002 is the gate this was added for - that is
# the failure this repository has actually had, with `fastapi-cache2` and
# `jinja2` sitting declared and unimported until somebody read all 46 lines by
# hand (#155).
#
# It reads `app`, `cli` and `alembic`, which is every tree that ships, and the
# scope is the whole point rather than a detail: reading `app` alone called
# `tabulate` dead when `cli/commands.py` imports it, which took the e2e seed
# down on this very branch. A tree that ships and is not scanned is a tree whose
# imports do not count.
#
# Two rules are off, each for its own reason, and turning either on is its own
# change rather than a flag flip:
#   DEP001 (imported, undeclared) fires on `faker` and `resend`, neither declared
#     anywhere and neither in `uv.lock`. `faker` is guarded; `resend` is not, so
#     a deployment that configures it raises `ModuleNotFoundError` at first send.
#     That is #829, and the decision there is whether they become extras - not
#     whether deptry shouts.
#   DEP003 (imported, only transitive) fires 27 times on `starlette`, `mcp`,
#     `yaml`, `openai`, `botocore`, `ddgs` and `opentelemetry` - every one of
#     them arriving through a declaration we do control (`fastapi`, the
#     `pydantic-ai-slim` extras, `boto3`, `logfire`). Declaring each by hand
#     would double the manifest to restate what those extras already promise.
#
# DEP004 (imported, declared dev-only) is the second gate: it found `anyio`,
# imported at module scope in application code and declared only in the `dev`
# group, and there is nothing left for it to be noisy about.
[tool.deptry]
known_first_party = ["app", "cli"]
ignore = ["DEP001", "DEP003"]

[tool.deptry.per_rule_ignores]
# Required, and imported nowhere in the scanned trees on purpose. Each is either
# a runtime somebody else imports or a driver a URL scheme selects.
DEP002 = [
    "python-multipart", # Starlette parses uploads with it; FastAPI refuses `File(...)` without it
    "asyncpg",          # selected by the `postgresql+asyncpg://` URL
    "psycopg2-binary",  # selected by Alembic's bare `postgresql://` URL
    "greenlet",         # SQLAlchemy's async bridge
    "itsdangerous",     # Starlette signs `SessionMiddleware` cookies with it
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The rule set is deliberately wide. A linter that only catches formatting is a
# linter people stop reading; these are the categories that catch real defects
# in an async, multi-tenant service — swallowed exceptions, blocking calls in a
# coroutine, mutable defaults, SQL built by string concatenation.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear — mutable defaults, unused loop vars, except sequencing
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async — blocking calls inside coroutines
    "S",    # flake8-bandit — the security rules that are not noise
    "A",    # flake8-builtins — shadowing `id`, `type`, `list`
    "DTZ",  # flake8-datetimez — naive datetimes, which corrupt spend windows
    "T20",  # flake8-print — stray print() in a service
    "LOG",  # flake8-logging — logger misuse
    "G",    # flake8-logging-format — f-strings in log calls
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate — commented-out code
    "TRY",  # tryceratops — swallowed and over-broad exception handling
]
ignore = [
    "E501",   # line length is the formatter's job
    "E402",   # module-level import not at top — the template's conditional imports
    "B008",   # call in a default argument — this is how FastAPI Depends works
    "B905",   # zip() without strict=
    "RUF012", # mutable class attribute without ClassVar
    "RUF059", # unpacked variable never used
    "TRY003", # long message outside the exception class — our errors carry context
    "TRY400", # logger.error vs logger.exception — both are used deliberately
    "S101",   # assert — used in tests, and allowed there by the per-file rules
    # S105/S106 fire on any identifier containing "token", "password" or
    # "secret". In an auth service that is `token_type="bearer"`, an enum member
    # named TOKEN, and a help string called token_hint. The signal-to-noise
    # ratio makes the rule unreadable rather than useful; real secret handling
    # is covered by the vault tests, which assert no key reaches a response.
    "S105",
    "S106",
    # Our own async surface is fully typed; ASYNC109/240 fire on the template's
    # RAG pipeline, where a `timeout` parameter and pathlib are deliberate and
    # rewriting them is a separate piece of work.
    "ASYNC109",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately do things production code must not: assert, hardcoded
# credentials in fixtures, reaching into private helpers to pin a branch.
# Alembic and the repository-root guard scripts came under ruff in #229 (before
# it, both were outside the paths ruff was invoked on and these ignores were dead
# config). Autogenerated migrations carry a commented-out downgrade stub (ERA001)
# and raw SQL passed to `op.execute` (S608); the usual structural rules make a
# migration harder to read, not easier.
"alembic/**" = ["ERA001", "S608"]
# The repository-root `scripts/` are console guards run by `make lint` and a Stop
# hook: printing to stdout is their whole purpose (T201), and `docs_drift.py`
# shells out to `git` by name with a literal argv it builds itself (S603, S607) -
# the same partial-path invocation already accepted for `tests/test_migrations.py`.
"../scripts/**" = ["T201", "S603", "S607"]
# Postgres cannot parameterise an identifier, so a table name must be
# interpolated. `_validate_collection_name` rejects anything but
# [a-zA-Z0-9_] before it reaches a query, and every *value* is bound. This is
# the correct pattern, not an exception to it.
"app/services/rag/vectorstore.py" = ["S608"]
# FastAPI exception handlers run while sys.exc_info() is still set, so
# logger.exception() captures the traceback correctly here despite not being
# lexically inside an `except` block.
"app/api/exception_handlers.py" = ["LOG004"]
# "id" shadows the builtin, but it is the registry's vocabulary and what agent
# specs store. Any other name would read worse at every call site.
"app/agents/capabilities/_registry.py" = ["A002"]
# Fixture helpers name their parameter `id` to mirror the model they stand in
# for; renaming it would make the fixtures read less like the thing they mock.
# Fixture and stub classes name their parameter `id` to mirror the model they
# stand in for; renaming it would make them read less like the thing they mock.
# Also relaxed here: the style rules whose whole value is readability in long
# production functions, which short test bodies do not have.
"tests/**" = [
    "S105",
    "S106",
    # A default like `password="secret"` in a fixture helper is the fixture, not
    # a leak. Real secret handling is asserted in tests/test_vault.py.
    "S107",
    "S311",
    # tests/test_migrations.py shells out to alembic on purpose; the "untrusted
    # input" is a literal argv this file wrote.
    "S603",
    # tests/test_ssrf.py names 0.0.0.0 because refusing to reach it is the
    # behaviour under test.
    "S104",
    "A002",
    "TRY300",
    "RET504",
    "PLR2004",
    "SLF001",
]
# The RAG pipeline came with the generator. `filter` as a parameter name, md5
# as a cache key (not a security primitive) and two blocking reads inside
# third-party SDK calls are its debt, tracked rather than silently accepted:
# they move out of this list when that subsystem is rewritten.
"app/services/rag/retrieval.py" = ["A002", "S324"]
"app/services/file_upload.py" = ["ASYNC230", "TRY300", "PTH123", "PTH108"]
# Template-inherited subsystems. These are readability rules whose value is
# real but whose cost right now is churn in code we did not design and are not
# yet responsible for. They lift file by file as each subsystem is rewritten —
# the list shrinking is the progress marker.
"app/core/sanitize.py" = ["PTH119", "S107"]
"app/services/agent.py" = ["TRY300", "TRY301"]
"app/services/channels/telegram.py" = ["TRY300", "S107"]
"app/services/rag/ingestion.py" = ["TRY300", "PTH123"]
"app/services/rag/documents.py" = ["PTH123"]
"app/services/rag/sources/google_drive.py" = ["ASYNC230", "PTH123"]
"app/worker/tasks/rag_tasks.py" = ["TRY300"]
"app/clients/redis.py" = ["TRY300"]
"app/core/security.py" = ["TRY300"]
"app/commands/seed.py" = ["S311"]
# A polling loop that exits on a flag rather than an Event, and one more
# blocking read inside a Google SDK call. Same tracked debt as the rest of the
# generator's channel and connector code.
"app/services/channels/slack.py" = ["ASYNC110"]
"app/services/rag/connectors/google_drive.py" = ["PTH123"]
# The CLI binds 0.0.0.0 because that is what a container needs, and its
# command bodies read fine as try/except/return.
"cli/**" = ["S104", "TRY300"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli"]

[tool.ty.terminal]
# The "warn" rules below are informational — don't let them fail `ty check`.
# The platform-layer override further down promotes them back to errors for our
# own code, and those do fail the run.
error-on-warning = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# `app/commands/` used to be here, which quietly took `app/commands/bootstrap.py`
# — a gated platform module — out of the checker altogether. An exclusion that
# hides one of the files the gate is supposed to cover is worth 23 warnings from
# the generator's other commands.
exclude = [
    "alembic/",
    "tests/",
    "cli/",
]

[tool.ty.rules]
# FastAPI Depends() injects at runtime — default=None on typed params is intentional
invalid-parameter-default = "warn"
# Starlette/FastAPI handler signatures use Union types that ty flags
invalid-argument-type = "warn"
# ORM models with Optional fields trigger on attribute assignment
invalid-assignment = "warn"
# Callable[..., Any] doesn't expose __name__ but function objects do
unresolved-attribute = "warn"
# datetime.utcnow deprecation warnings
deprecated = "warn"
# Optional deps imported inside try/except (pymupdf, docx, faker) and
# feature-gated models referenced best-effort by the admin dashboard. These are
# expected to be absent in some configs, so don't surface them at all.
unresolved-import = "ignore"
# dict() overload matching on dynamic types from validators
no-matching-overload = "warn"
# Template uses mypy-style `# type: ignore` comments which ty doesn't recognize
unused-type-ignore-comment = "warn"
# A `# ty: ignore` needed in one database/feature config can be unused in
# another generated from the same template — don't fail on that.
unused-ignore-comment = "ignore"
# Operations on Unknown types from untyped libraries (pymupdf, etc.)
unsupported-operator = "warn"
# redis-py / asyncio overloads return Awaitable[T] | T which ty rejects as awaitable
invalid-await = "warn"
# sessionmaker(class_=AsyncSession) returns sync sessionmaker per overloads
# but the resulting callable still produces an async context manager.
invalid-context-manager = "warn"
# Helpers like get_agent accept **kwargs but their stubs only list specific params
missing-argument = "warn"

# Every rule above is downgraded because of a library we did not choose and do
# not own. None of those reasons apply to the code we wrote, so the platform
# layer — everything AgenticOS adds on top of the generated template — gets them
# back as errors, and `ty check` can fail a build again.
#
# The list below is `[tool.coverage.run] include`, verbatim and in the same
# order. It is the same definition of "ours" for both gates on purpose: a module
# held to 100% coverage is held to the type checker too, and a module added to
# one list belongs in the other. `tests/test_coverage_gate.py` keeps the two
# from drifting.
[[tool.ty.overrides]]
include = [
    "app/agents/**",
    "app/commands/bootstrap.py",
    "app/commands/audit_skill_bindings.py",
    "app/core/permissions.py",
    "app/core/catalog/**",
    "app/core/secret_kinds.py",
    "app/core/vault.py",
    "app/core/background.py",
    # The client that dials the address it validated, for a URL the party being
    # validated chose. A miss here is an SSRF the operator cannot see.
    "app/core/pinned_http.py",
    # The one size limit that runs before a body is read. Every other one in this
    # codebase measures bytes that have already arrived.
    "app/core/body_limit.py",
    # The worker's judgement of its own event loop. It decides to `SIGKILL` the
    # process it runs in, on the two stacks that have no supervisor reading a
    # beat from outside - so a wrong verdict is a restart loop in production.
    "app/core/watchdog.py",
    # What a refusal is allowed to say about the field it refuses. One shape on
    # the wire and one place that builds it - the module reads `loc` and `msg`
    # and nothing else, which is what keeps a caller's own submission out of a
    # response body a fifth call site would otherwise hand it (#882).
    "app/core/field_errors.py",
    # Which tables alembic owns and which the vector store makes at runtime. It is
    # two statements, and one of them decides whether `db-check` reports real drift.
    "app/db/vector_tables.py",
    # Which explicit `null` on an update may reach a row. It is one function and
    # it stands between a legal request and a 500 naming a database constraint
    # (#637), which is the kind of thing a branch that never runs is exactly how
    # it comes back.
    "app/db/updates.py",
    "app/services/access.py",
    # How often a stranger may reach a public surface. It was configured and
    # never applied for the whole life of the product (#39), which is the
    # argument for holding the replacement to the bar every other refusal is
    # held to rather than reporting it.
    "app/services/rate_limit.py",
    "app/services/agent_chat.py",
    "app/services/agent_environment.py",
    "app/services/agent_exposure.py",
    "app/services/agent_registry.py",
    "app/services/agent_runner.py",
    "app/services/agent_session.py",
    # The turn loop itself, shared by the dashboard chat and the embedded
    # widget since #634. One frame vocabulary for both sockets, and the sink a
    # public surface filters at - so a toggle that fails open sends an agent's
    # reasoning to a stranger.
    "app/services/run_stream.py",
    "app/repositories/agent_workspace.py",
    "app/repositories/sandbox_connection.py",
    "app/repositories/skill_proposal.py",
    "app/services/attachments.py",
    "app/services/chat_timeline.py",
    "app/services/sandbox_connection.py",
    "app/services/sandbox_workspace.py",
    "app/services/usage_report.py",
