  - Features: features.md
  - Learn:
      - learn/index.md
      - Get started:
          - install.md
          - first-agent.md
          - concepts.md
          - console.md
          - screens.md
      - Build the agent:
          - choosing-models.md
          - models.md
          - skills.md
          - context.md
          - file-processing.md
          - mcp.md
          - sandbox.md
          - triggers.md
      - Put it in front of people:
          - environments.md
          - channels.md
          - desktop.md
          - rollout.md
          - deployment.md
          - deploy.md
      - Keep it under control:
          - permissions.md
          - governance.md
          - secrets.md
      - How-to - recipes:
          - howto/set-up-knowledge-base.md
          - howto/customize-agent-prompt.md
          - howto/configure-sync-sources.md
          - howto/use-ratings.md
  - Reference:
      - api.md
      - configuration.md
      - commands.md
      - reference/spec.md
      - reference/capabilities.md
      - reference/permissions.md
  - Resources:
      - resources/index.md
      - Development - contributing:
