# AgenticOS documentation.
#
# `docs/` is both the site and the repository's own engineering notes, and that
# is deliberate: a second copy of "how a capability works" written for outsiders
# is a copy that disagrees with the one contributors read. The nav below decides
# what an outside reader meets first; nothing is duplicated for them.
site_name: AgenticOS
site_description: The operating system for your company's AI agents. Self-hosted, open source, and yours.
site_url: https://vstorm-co.github.io/agenticos/
repo_url: https://github.com/vstorm-co/agenticos
repo_name: vstorm-co/agenticos
edit_uri: edit/main/docs/

docs_dir: docs

# Working material - design demos for pull-request review, change plans, audit
# reports - is engineering notes rather than site pages. Unlisted they would
# still build and publish as orphans nothing links to, which is how a page goes
# stale unseen; they stay readable in the repository, where they are written.
exclude_docs: |
  design/
  plans/
  audits/

theme:
  name: material
  language: en
  # One mark, drawn as paths in `docs/assets/mark.svg`, hand-authored rather
  # than imported from an icon package - the same bargain
  # `frontend/src/lib/brand-glyphs.generated.ts` takes with every other mark
  # this product draws. The README's hero embeds the same shapes inline
  # (`.github/assets/hero-*.svg`), because a `<picture>` there cannot reach a
  # separate file per theme and a second copy of nine path commands is cheaper
  # than a build step for one graphic.
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    # A theme per system preference, with a manual override - the same bargain
    # the app itself makes.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # The seven tabs are the top-level shape of this site, so they stay on
    # screen while a page scrolls - a reader three sections into `governance.md`
    # can still see that Reference is one click away.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    # Learn is a sequence, not a bag of pages. The footer's previous/next is what
    # makes reading it in order the default rather than a thing you have to
    # navigate back to the sidebar for.
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
    # The tabs on the home page and in the guides pair "what somebody edits"
    # with "what it becomes". Linking them means a reader who picks the file
    # view once keeps it on every page that offers the same pair.
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Without these two, `:material-download:{ .lg .middle }` reaches the page as
  # that literal string - the grid cards on the home page were rendering their
  # own source.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # The custom fence is what turns a ```mermaid block into a diagram. Without it
  # superfences hands the block to the syntax highlighter and the reader gets the
  # graph's source in a code box, which is how `concepts.md` shipped.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

# `scripts/mkdocs_hooks.py` reads CHANGELOG.md into the release-notes page - see
# its docstring for why that is a hook rather than a snippet include.
hooks:
  - scripts/mkdocs_hooks.py

# `mkdocs serve` watches `docs/` and this file. The release-notes page is built
# from a file outside both.
watch:
  - CHANGELOG.md

plugins:
  - search
  # Screenshots of the console are the only thing on this site a reader cannot
  # zoom into, and they carry small text - a model picker, a budget field. This
  # makes them click-to-enlarge rather than asking somebody to open the image in
  # a new tab and hunt for it.
  - glightbox:
      effect: zoom
      touchNavigation: true
      draggable: true
      auto_caption: true
      caption_position: bottom
  # The API reference is generated from the docstrings rather than written twice.
  # This codebase puts its reasoning in docstrings - why a scope comparison
  # raises, why an audience resolves the way it does - so a hand-written
  # reference would be a worse copy of something already there.
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            filters: ["!^_"]

nav:
  - AgenticOS: index.md
  - Features: features.md
  - Learn:
      - learn/index.md
      - Get started:
          - install.md
          - first-agent.md
          - concepts.md
      - Build the agent:
          - models.md
          - skills.md
          - file-processing.md
          - mcp.md
          - sandbox.md
          - triggers.md
      - Put it in front of people:
          - channels.md
          - deployment.md
          - deploy.md
      - Keep it under control:
          - permissions.md
          - governance.md
          - secrets.md
      - How-to - recipes:
          - howto/customize-agent-prompt.md
          - howto/configure-sync-sources.md
          - howto/use-ratings.md
  - Reference:
      - configuration.md
      - commands.md
      - reference/spec.md
      - reference/capabilities.md
      - reference/permissions.md
  - Resources:
      - resources/index.md
      - Development - contributing:
          - architecture.md
          - patterns.md
          - adding_features.md
          - testing.md
          - code-review.md
          - branching.md
      - Extending the platform:
          - howto/add-capability.md
          - howto/add-mcp-server.md
          - howto/add-api-endpoint.md
          - howto/add-background-task.md
          - howto/add-sync-connector.md
  - About:
      - about/index.md
      - about/comparison.md
      - about/design.md
      - ROADMAP.md
  - Release Notes: release-notes.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vstorm-co/agenticos
