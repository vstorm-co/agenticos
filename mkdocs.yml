# AgenticOS documentation.
#
# `docs/` is both the site and the repository's own engineering notes, and that
# is deliberate: a second copy of "how a capability works" written for outsiders
# is a copy that disagrees with the one contributors read. The nav below decides
# what an outside reader meets first; nothing is duplicated for them.
site_name: AgenticOS
site_description: One place to build, run and govern your company's AI agents. Self-hosted, open source, and yours.
site_url: https://vstorm-co.github.io/agenticos/
repo_url: https://github.com/vstorm-co/agenticos
repo_name: vstorm-co/agenticos
edit_uri: edit/main/docs/

docs_dir: docs

# Working material - design demos for pull-request review, change plans, audit
# reports - is engineering notes rather than site pages. Unlisted they would
# still build and publish as orphans nothing links to, which is how a page goes
# stale unseen; they stay readable in the repository, where they are written.
# `ROADMAP.md` and `about/design.md` are the same kind of material one level up:
# delivery state written in board shorthand, and the six decisions a contributor
# needs before their first change. Both are read in the repository, by somebody
# who has already decided to work on this - publishing them put an internal
# status report in a tab a prospective user meets first.
exclude_docs: |
  design/
  plans/
  audits/
  ROADMAP.md
  about/design.md
  assets/screens/README.md

theme:
  name: material
  language: en
  # One mark, drawn as paths in `docs/assets/mark.svg`, hand-authored rather
  # than imported from an icon package - the same bargain
  # `frontend/src/lib/brand-glyphs.generated.ts` takes with every other mark
  # this product draws. The README shows this same file rather than a second
  # rendering of it; one accent that reads on both a light and a dark page is
  # what lets one mark serve the tab, the site header and the README.
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    # A theme per system preference, with a manual override - the same bargain
    # the app itself makes.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # The seven tabs are the top-level shape of this site, so they stay on
    # screen while a page scrolls - a reader three sections into `governance.md`
    # can still see that Reference is one click away.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    # `navigation.instant` is deliberately absent. Material's language switcher
    # keeps the reader on the same page in the other language, and that link is
    # built server-side per page - instant loading swaps the body without
    # rebuilding it, so the switcher silently starts sending everyone to the
    # locale's home page instead. Losing a reader's place on every language
    # switch costs more than the load it saved.
    - navigation.tracking
    - navigation.indexes
    # Learn is a sequence, not a bag of pages. The footer's previous/next is what
    # makes reading it in order the default rather than a thing you have to
    # navigate back to the sidebar for.
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
    # The tabs on the home page and in the guides pair "what somebody edits"
    # with "what it becomes". Linking them means a reader who picks the file
    # view once keeps it on every page that offers the same pair.
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Without these two, `:material-download:{ .lg .middle }` reaches the page as
  # that literal string - the grid cards on the home page were rendering their
  # own source.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # The custom fence is what turns a ```mermaid block into a diagram. Without it
  # superfences hands the block to the syntax highlighter and the reader gets the
  # graph's source in a code box, which is how `concepts.md` shipped.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

# `scripts/mkdocs_hooks.py` reads CHANGELOG.md into the release-notes page - see
# its docstring for why that is a hook rather than a snippet include.
hooks:
  - scripts/mkdocs_hooks.py

# `mkdocs serve` watches `docs/` and this file. The release-notes page is built
# from a file outside both.
watch:
  - CHANGELOG.md

plugins:
  # First in the list on purpose: every plugin below it runs once per locale,
  # against the file tree this one has already resolved. `suffix` structure means
  # a translation sits beside its source as `<page>.<locale>.md`, so the English
  # URLs the site has always published keep working - `/install/` stays where it
  # is and `/pl/install/` is added next to it, rather than everything moving
  # under `/en/` and every existing link breaking.
  #
  # `fallback_to_default` is what stops a missing translation from 404ing. It
  # serves the English page under the localized URL instead, and
  # `scripts/mkdocs_hooks.py` stamps a notice on it saying so - an untranslated
  # page a reader cannot tell from a translated one is the failure this whole
  # arrangement exists to avoid.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_description: One place to build, run and govern your company's AI agents. Self-hosted, open source, and yours.
        - locale: pl
          name: Polski
          build: true
          site_description: Jedno miejsce, w którym budujesz, uruchamiasz i nadzorujesz agentów AI swojej firmy. Self-hosted, open source i w pełni Twoje.
          nav_translations:
            Features: Funkcje
            Learn: Nauka
            Get started: Pierwsze kroki
            Build the agent: Zbuduj agenta
            Put it in front of people: Udostępnij go ludziom
            Keep it under control: Zachowaj kontrolę
            How-to - recipes: Przewodniki - przepisy
            Reference: Referencje
            Resources: Zasoby
            Development - contributing: Rozwój - współtworzenie
            Extending the platform: Rozszerzanie platformy
            About: O projekcie
            Release Notes: Informacje o wydaniach
        - locale: de
          name: Deutsch
          build: true
          site_description: Ein Ort, um die KI-Agenten Ihres Unternehmens zu bauen, zu betreiben und zu steuern. Selbst gehostet, quelloffen und Ihr Eigentum.
          nav_translations:
            Features: Funktionen
            Learn: Lernen
            Get started: Erste Schritte
            Build the agent: Den Agent bauen
            Put it in front of people: Für Nutzer bereitstellen
            Keep it under control: Unter Kontrolle halten
            How-to - recipes: Anleitungen - Rezepte
            Reference: Referenz
            Resources: Ressourcen
            Development - contributing: Entwicklung - Mitwirken
            Extending the platform: Die Plattform erweitern
            About: Über das Projekt
            Release Notes: Versionshinweise
        - locale: es
          name: Español
          build: true
          site_description: Un solo lugar para construir, ejecutar y gobernar los agentes de IA de tu empresa. Autoalojado, de código abierto y tuyo.
          nav_translations:
            Features: Funciones
            Learn: Aprende
            Get started: Primeros pasos
            Build the agent: Construye el agent
            Put it in front of people: Ponlo delante de las personas
            Keep it under control: Mantenlo bajo control
            How-to - recipes: Guías prácticas - recetas
            Reference: Referencia
            Resources: Recursos
            Development - contributing: Desarrollo - contribuir
            Extending the platform: Ampliar la plataforma
            About: Acerca del proyecto
            Release Notes: Notas de la versión
  - search
  # Screenshots of the console are the only thing on this site a reader cannot
  # zoom into, and they carry small text - a model picker, a budget field. This
  # makes them click-to-enlarge rather than asking somebody to open the image in
  # a new tab and hunt for it.
  - glightbox:
      effect: zoom
      touchNavigation: true
      draggable: true
      auto_caption: true
      caption_position: bottom
  # The API reference is generated from the docstrings rather than written twice.
  # This codebase puts its reasoning in docstrings - why a scope comparison
  # raises, why an audience resolves the way it does - so a hand-written
  # reference would be a worse copy of something already there.
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            filters: ["!^_"]

nav:
