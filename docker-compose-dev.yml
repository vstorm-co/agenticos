# The dev server. `make dev-server`.
#
#   docker compose --env-file backend/.env -f docker-compose-dev.yml up -d --build
#
# A deployed environment, not a laptop: images are built rather than
# bind-mounted, uvicorn does not reload, and Postgres and Redis are not
# published to the host. It differs from production in the things a shared
# testing environment wants — verbose logging, a single worker, no resource
# ceilings, and `ENVIRONMENT=dev` so an agent's traces and alerts are separable
# from real ones.
#
# Put a reverse proxy in front of port 8000; `nginx/nginx.conf` is the template.
# The frontend is `docker-compose-dev.frontend.yml`.

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agenticos_backend:dev-server
    container_name: agenticos_backend
    volumes:
      - media_data:/app/media
      # email/templates.py reads pre-compiled HTML/text from /app/emails/compiled.
      # Build context is ./backend so the dir isn't in the image — mount it.
      - ./emails:/app/emails:ro
    env_file:
      - ./backend/.env
    environment:
      # Verbose on purpose: this is where a failure is meant to be diagnosed.
      - DEBUG=true
      - ENVIRONMENT=dev
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which is broken with websockets >=14 (handshake → HTTP 500). Required for
    # the chat WS. No --reload: there is no mounted source to watch.
    #
    # One process, and PID 1 is the server itself - so there is no supervisor
    # here and deliberately none added (#358). A worker that *dies* takes the
    # container with it and `restart: unless-stopped` below acts; a worker whose
    # event loop stops turning used to keep the container `Up` and serving
    # nothing, and now ends its own process from `app/core/watchdog.py` after
    # fifteen silent seconds, which lands it in the first case. `--workers 2` would have
    # bought uvicorn's own supervisor instead, at a second interpreter on a
    # small box, and only for a *stopped* PID 1 - which the kernel makes
    # unreachable anyway, dropping `SIGSTOP` sent to a namespace's init from
    # inside it. `EVENT_LOOP_WEDGED_AFTER` in `backend/.env` changes the
    # threshold, `0` switches it off.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws websockets-sansio
    ports:
      - "8000:8000"
    networks:
      backend:
        # `nginx/nginx.conf` proxies to `backend:8000`. The alias makes that
        # template resolve without the operator having to rename anything.
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Moved out of backend/Dockerfile, which the Prefect runner shares and could
    # never answer; see docker-compose.yml for the whole reasoning, including why
    # `raise_for_status` and a 30s start_period are not what the image had.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    # pgvector, not stock postgres: the RAG store runs
    # `CREATE EXTENSION IF NOT EXISTS vector` when a collection is first
    # written to, and on postgres:16-alpine that fails with
    # `extension "vector" is not available` — so every document upload 500s
    # before a row is committed.
    image: pgvector/pgvector:pg16
    container_name: agenticos_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-agenticos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: reachable only from this network.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agenticos_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: agenticos_prefect_server
    command: prefect server start --host 0.0.0.0
    volumes:
      - prefect_data:/root/.local/share/prefect/
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
      - PREFECT_SERVER_API_HOST=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prefect-runner:
    # Ingestion, collection syncs and scheduled reports run here. Without it
    # documents upload and then never become searchable.
    image: agenticos_backend:dev-server
    pull_policy: never
    container_name: agenticos_prefect_runner
    volumes:
      - media_data:/app/media
      - ./emails:/app/emails:ro
    command: python -m app.worker.prefect_app
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=dev
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # The runner's own health endpoint, started by app/worker/prefect_app.py.
      # Bound to the loopback because the same webserver serves `/shutdown`; see
      # docker-compose.yml.
      - PREFECT_RUNNER_SERVER_HOST=127.0.0.1
      - PREFECT_RUNNER_SERVER_PORT=8080
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
    networks:
      - backend
    depends_on:
      prefect-server:
        condition: service_healthy
      db:
        condition: service_healthy
      app:
        condition: service_started
    # 503 once the runner has missed two polls; the start_period covers the
    # application import and the first poll. See docker-compose.yml.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8080/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # The only service holding the Docker socket. See docker-compose.yml for the
  # reasoning; the differences here are that it is not on by default (mounting
  # the socket on a shared host is a deliberate act) and that the image tag is
  # pinned rather than tracking a minor.
  sandboxd:
    image: ghcr.io/vstorm-co/sandboxd:0.2
    container_name: agenticos_sandboxd_dev
    profiles: [sandbox]
    # The token comes from the same file every other secret in this stack comes
    # from, rather than through compose interpolation. Interpolation reads the
    # project root, not `backend/.env`, so a token generated where the
    # application reads it would have been invisible here - and every other
    # variable in this file carries a default precisely so the stack starts with
    # no env file at all. The service exits naming the variable when it is
    # missing, which `docker compose logs sandboxd` shows.
    env_file:
      - ./backend/.env
    environment:
      SANDBOXD_HOST: 0.0.0.0
      SANDBOXD_PORT: "8080"
      # Mounted at the same path on both sides, which is the only arrangement
      # that works: this service creates the directory and then asks the daemon
      # to bind-mount it, and the daemon resolves the path on the host. A named
      # volume, or any path that exists only in this container, is refused with
      # "mounts denied".
      #
      # The directory has to be writable by uid 10001 - `install -d -o 10001`
      # once, on the host - and it is where a conversation's files live, so it
      # belongs on storage somebody backs up.
      SANDBOXD_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}
      # Which environments an agent may ask for. **Generated - do not edit here.**
      # `make sandbox-runtimes` writes it from
      # backend/app/core/catalog/sandbox_runtimes.json, which is where a runtime
      # is added or a package changed, and which the connection dialog offers as
      # well - so the two cannot disagree about what this deployment ships.
      # `backend/tests/test_sandbox_runtime_catalog.py` fails when this line has
      # drifted from that file.
      #
      # Written into a tracked file rather than read from one at start-up because
      # `docker compose up` has to work without generating anything first;
      # otherwise a deployment silently gets the library's own default allowlist.
      #
      # Not a form in the product, and that is upstream's decision rather than an
      # omission: `PUT /policy` changes ceilings and lifetimes at run time and
      # deliberately refuses `runtimes` membership, because naming an image is a
      # decision about isolation and this token belongs to an application rather
      # than to whoever runs the host. Changing the list is a restart, and
      # `prewarm` rebuilds what it names as the service starts rather than inside
      # somebody's first request - which is minutes on a cold cache, and the
      # reason this deployment ships one runtime rather than eight.
      SANDBOXD_RUNTIMES: '{"workbench":{"description":"Python 3.12 and Node 24 with the tools and libraries to read, write and plot the files a conversation is about","runtime":{"name":"workbench","base_image":"python:3.12-slim","description":"Python 3.12 and Node 24 with the tools and libraries to read, write and plot the files a conversation is about","setup_commands":["apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates ripgrep fd-find jq less procps xz-utils poppler-utils unzip zip tzdata fonts-dejavu-core && ln -s /usr/bin/fdfind /usr/local/bin/fd && rm -rf /var/lib/apt/lists/*","arch=\"$(dpkg --print-architecture)\"; case \"$arch\" in amd64) node_arch=x64 ;; arm64) node_arch=arm64 ;; *) echo \"no Node build for $arch\" >&2; exit 1 ;; esac; curl -fsSL \"https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-${node_arch}.tar.xz\" | tar -xJ -C /usr/local --strip-components=1 --exclude CHANGELOG.md --exclude README.md --exclude LICENSE && npm install -g tsx && npm cache clean --force","curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh"],"packages":["liteparse","pypdf","python-docx","openpyxl","python-pptx","pillow","pandas","duckdb","matplotlib","httpx","requests","beautifulsoup4","lxml","markdownify","pyyaml","tabulate","reportlab"],"env_vars":{"PYTHONUNBUFFERED":"1","PYTHONDONTWRITEBYTECODE":"1","PYTHONUTF8":"1","MPLBACKEND":"Agg","PIP_DISABLE_PIP_VERSION_CHECK":"1"}},"mem_limit":"2g","network_mode":"bridge"}}'
      # An escape starts from whoever the container runs as, and the default is
      # root. The image is built around this uid - a home directory and a
      # virtualenv it owns, without which an agent's `pip install` fails - so it
      # only applies to a runtime this deployment builds, which `workbench` is.
      # It also makes every file an agent writes owned by this uid on the host,
      # rather than by root.
      #
      # **The service's own uid, and it has to be.** Opening a session `chown`s
      # the workspace to this user, and a sandboxd running unprivileged can only
      # do that for itself - so a different number here fails at the first
      # session rather than at start-up.
      SANDBOXD_SANDBOX_UID: "10001"
      SANDBOXD_PERSIST_CONTAINERS: "true"
      # What a session installed inside its container - the build, the wheels,
      # `node_modules` - reclaimed a day after it stopped. Without it a persisted
      # container is kept for ever and the host fills up with the ones nobody
      # reattached to. The workspace is untouched: the files are the work, the
      # container is rebuildable.
      SANDBOXD_CONTAINER_TTL: "86400"
      SANDBOXD_MAX_SESSIONS_PER_TENANT: "10"
      SANDBOXD_NETWORK_MODE: none
      SANDBOXD_UI_ENABLED: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}:${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    name: agenticos_backend
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  prefect_data:
