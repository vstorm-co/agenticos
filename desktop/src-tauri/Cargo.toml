[package]
name = "agenticos-desktop"
version = "0.1.0"
description = "The AgenticOS console in a window of its own"
license = "Apache-2.0"
repository = "https://github.com/vstorm-co/agenticos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agenticos_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
