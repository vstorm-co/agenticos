[package]
name = "agenticos-shell-core"
version = "0.2.0"
description = "What the AgenticOS desktop and mobile shells share about reaching a deployment"
license = "Apache-2.0"
repository = "https://github.com/vstorm-co/agenticos"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2"
uuid = { version = "1", features = ["v4"] }
