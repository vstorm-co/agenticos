# =============================================================================
# Nginx Configuration for agenticos
# Generated by fastapi-fullstack
# =============================================================================
#
# This configuration provides:
# - Reverse proxy for backend API (api.DOMAIN)

# - Reverse proxy for frontend (DOMAIN)


# - WebSocket support for /ws endpoint
# - HSTS (the application sets the other security headers)
# - HTTP to HTTPS redirect
#
# SSL Certificates:
# Place your SSL certificates in the nginx/ssl/ directory:
# - nginx/ssl/cert.pem (certificate)
# - nginx/ssl/key.pem (private key)
#
# For Let's Encrypt with certbot:
# certbot certonly --webroot -w /var/www/certbot -d api.yourdomain.com -d yourdomain.com
# =============================================================================

# Where the stack is. `docker-compose-prod.yml` publishes both on the loopback
# (`BIND_HOST`, 127.0.0.1 by default), which is what an Nginx running on the host
# reaches. An Nginx running *as a container on the `edge` network* uses the
# service aliases instead - `backend:8000` and `frontend:3000` - and those names
# resolve nowhere else, which is why they are not the default here.
upstream backend {
    server 127.0.0.1:8000;
}


upstream frontend {
    server 127.0.0.1:3000;
}



# =============================================================================
# HTTP Server - Redirect to HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS Server - Backend API (api.DOMAIN)
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.${DOMAIN:-localhost};

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS only. TLS terminates here, so this is the one header that is the
    # proxy's to set; the rest - the Content-Security-Policy, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy - come from the application on every
    # response and pass through. A second copy here gave the console both
    # `X-Frame-Options: DENY` and `SAMEORIGIN` on one response, which lets the
    # browser pick either (#1416).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support for /ws endpoint
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API endpoints
    location / {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


# =============================================================================
# HTTPS Server - Frontend (DOMAIN)
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN:-localhost};

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # HSTS only. TLS terminates here, so this is the one header that is the
    # proxy's to set; the rest - the Content-Security-Policy, X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy - come from the application on every
    # response and pass through. A second copy here gave the console both
    # `X-Frame-Options: DENY` and `SAMEORIGIN` on one response, which lets the
    # browser pick either (#1416).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend application
    location / {
        proxy_pass http://frontend;
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js HMR WebSocket (development)
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
