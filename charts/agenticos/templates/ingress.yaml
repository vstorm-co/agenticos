{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agenticos.name" . }}
  labels:
    {{- include "agenticos.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $component := list "api" "frontend" }}
    - host: {{ if eq $component "api" }}{{ required "ingress.apiHost is required" $.Values.ingress.apiHost | quote }}{{ else }}{{ required "ingress.siteHost is required" $.Values.ingress.siteHost | quote }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agenticos.name" $ }}-{{ $component }}
                port:
                  number: {{ if eq $component "api" }}8000{{ else }}3000{{ end }}
    {{- end }}
{{- end }}
