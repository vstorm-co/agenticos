# Tested with restricted-v2 on local OpenShift 5.0.0; validate your cluster too.
# See docs/kubernetes.md for evidence and limits. Never grant anyuid or privileged SCCs.
podSecurityContext:
  runAsNonRoot: true
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault
api:
  runAsUser: null
worker:
  runAsUser: null
frontend:
  runAsUser: null
