name: Mattermost plugin
on:
  pull_request:
    paths: ["plugins/mattermost/**", "docs/assets/logo.svg", ".github/workflows/mattermost-plugin.yml"]
  push:
    branches: [main]
    paths: ["plugins/mattermost/**", "docs/assets/logo.svg", ".github/workflows/mattermost-plugin.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mattermost-plugin-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/mattermost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.11"
          cache-dependency-path: plugins/mattermost/go.sum
      - run: make check bundle
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agenticos-mattermost-plugin
          path: plugins/mattermost/dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error
