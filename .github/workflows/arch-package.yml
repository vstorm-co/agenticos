name: Native Arch desktop package

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

env:
  ARCH_OUTPUT: /tmp/agenticos-arch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    container:
      image: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - name: Install native build and display dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust clang pkgconf python webkit2gtk-4.1 gtk3 libayatana-appindicator xdotool libxcb libpipewire dbus hicolor-icon-theme
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Build the native pacman package as an unprivileged user
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p "$ARCH_OUTPUT"
          chown builder:builder "$ARCH_OUTPUT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- bash scripts/build_arch_package.sh "$ARCH_OUTPUT"
          (cd "$ARCH_OUTPUT" && sha256sum agenticos-*-1-x86_64.pkg.tar.zst > SHA256SUMS.arch)
      - name: Prepare a second package revision for upgrade verification
        run: |
          sed -i 's/^pkgrel=1$/pkgrel=2/' "$ARCH_OUTPUT/PKGBUILD"
          cd "$ARCH_OUTPUT"
          runuser -u builder -- makepkg --repackage --force --noconfirm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-native-packages
          path: |
            ${{ env.ARCH_OUTPUT }}/*.pkg.tar.zst
            ${{ env.ARCH_OUTPUT }}/SHA256SUMS.arch
          if-no-files-found: error

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - name: Prepare a fresh runtime without the build toolchain
        run: |
          pacman -Syu --noconfirm --needed git dbus mesa weston xorg-server-xvfb xorg-xauth desktop-file-utils github-cli
          useradd --create-home builder
          for PACKAGE in rust clang base-devel; do
            if pacman -Q "$PACKAGE"; then exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-native-packages
          path: ${{ env.ARCH_OUTPUT }}
      - name: Verify install, upgrade, X11 and Wayland rendering, and removal
        run: |
          chown -R builder:builder "$ARCH_OUTPUT"
          cd "$ARCH_OUTPUT"
          sha256sum -c SHA256SUMS.arch
          cd "$GITHUB_WORKSPACE"
          bash scripts/check_arch_package.sh "$ARCH_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arch-native
          path: |
            ${{ env.ARCH_OUTPUT }}/*.log
            ${{ env.ARCH_OUTPUT }}/*-libraries.txt
            ${{ env.ARCH_OUTPUT }}/tested-environment.txt
      - name: Upload the verified pacman package to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber "$ARCH_OUTPUT"/agenticos-*-1-x86_64.pkg.tar.zst "$ARCH_OUTPUT/SHA256SUMS.arch" --repo "$GITHUB_REPOSITORY"
