name: App release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable platform release tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: app-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          COMMIT=$(git rev-parse --verify "$TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" origin/main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          jq -e '.draft == false and .prerelease == false' "$RUNNER_TEMP/release.json"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .id "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"
  desktop:
    needs: resolve
    environment: apps-release
    strategy:
      fail-fast: false
      # Each action updates the same latest.json release asset.
      max-parallel: 1
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.resolve.outputs.commit }}", persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libgbm-dev clang
      - name: Prepare version and signing
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.AGENTICOS_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_KEY"
          test -n "$UPDATE_PUBLIC_KEY"
          python3 scripts/prepare_app_release.py "$TAG"
          rustup target add '${{ matrix.target }}'
          cd desktop && bun install --frozen-lockfile
      - name: Require macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_USER: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: test -n "$CERTIFICATE" && test -n "$APPLE_USER" && test -n "$APPLE_APP_PASSWORD"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $config = @{}
          if ($env:CERTIFICATE) {
            $file = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $config = @{bundle=@{windows=@{certificateThumbprint=$cert.Thumbprint; timestampUrl='http://timestamp.digicert.com'}}}
            Remove-Item $file
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content desktop/src-tauri/tauri.windows.release.conf.json
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          AGENTICOS_UPDATER_PUBLIC_KEY: ${{ vars.AGENTICOS_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.resolve.outputs.id }}
          tagName: ${{ needs.resolve.outputs.tag }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json ${{ runner.os == 'Windows' && '--config src-tauri/tauri.windows.release.conf.json' || '' }} -- --locked
          includeUpdaterJson: true
  android:
    needs: resolve
    if: vars.AGENTICOS_MOBILE_RELEASES_ENABLED == 'true'
    environment: apps-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.resolve.outputs.commit }}", persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Android signing and toolchain
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android.keystore"
          chmod 600 "$RUNNER_TEMP/android.keystore"
          python3 scripts/prepare_app_release.py "$TAG"
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bun install --frozen-lockfile && bunx tauri android build --target aarch64 --apk --ci -- --locked
      - name: Attach APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          APK=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/AgenticOS-android-arm64.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/AgenticOS-android-arm64.apk" --clobber
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android.keystore"
  ios:
    needs: resolve
    if: vars.AGENTICOS_MOBILE_RELEASES_ENABLED == 'true' && vars.AGENTICOS_TESTFLIGHT_ENABLED == 'true'
    environment: apps-release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.resolve.outputs.commit }}", persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Prepare distribution identity and provisioning
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILES: ${{ secrets.IOS_PROFILES_BASE64_JSON }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE" && test -n "$PROFILES" && test -n "$API_KEY"
          python3 scripts/prepare_app_release.py "$TAG"
          rustup target add aarch64-apple-ios
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/apps.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/apps.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/apps.keychain-db"
          security import "$RUNNER_TEMP/ios.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/apps.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/apps.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/apps.keychain-db"
          python3 - <<'PY'
          import base64, json, os, pathlib, plistlib, subprocess
          target = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          target.mkdir(parents=True, exist_ok=True)
          for encoded in json.loads(os.environ['PROFILES']):
              raw = base64.b64decode(encoded, validate=True)
              profile = plistlib.loads(subprocess.run(['security', 'cms', '-D'], input=raw, capture_output=True, check=True).stdout)
              identifier = profile['UUID']
              if not isinstance(identifier, str) or any(c not in '0123456789abcdefABCDEF-' for c in identifier):
                  raise ValueError('Invalid provisioning profile UUID')
              (target / f'{identifier}.mobileprovision').write_bytes(raw)
          private = pathlib.Path.home() / '.appstoreconnect/private_keys'
          private.mkdir(parents=True, exist_ok=True)
          key_id = os.environ['API_KEY_ID']
          if not key_id.isalnum():
              raise ValueError('Invalid App Store Connect key ID')
          key = private / f'AuthKey_{key_id}.p8'
          key.write_text(os.environ['API_KEY'])
          key.chmod(0o600)
          PY
      - name: Build IPA for App Store Connect and TestFlight
        working-directory: mobile
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/appstore-key.p8
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" "$APPLE_API_KEY_PATH"
          bun install --frozen-lockfile
          bunx tauri ios build --target aarch64 --export-method app-store-connect --build-number "$BUILD_NUMBER" --ci -- --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-distribution
          path: mobile/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
      - name: Submit to TestFlight processing
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find mobile/src-tauri/gen/apple/build -name '*.ipa' -type f | head -1)
          test -n "$IPA"
          xcrun iTMSTransporter -m upload -assetFile "$IPA" -apiKey "$API_KEY" -apiIssuer "$API_ISSUER"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/apps.keychain-db" || true
          rm -f "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/appstore-key.p8"
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"

  homebrew:
    timeout-minutes: 10
    needs: [resolve, desktop]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.resolve.outputs.commit }}", persist-credentials: false}
      - name: Attach the cask for both Mac architectures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.dmg' --dir "$RUNNER_TEMP/dmgs"
          python3 scripts/homebrew_cask.py "$RUNNER_TEMP/dmgs" "$TAG" > "$RUNNER_TEMP/agenticos.rb"
          gh release upload "$TAG" "$RUNNER_TEMP/agenticos.rb" --clobber
