# CodeQL, on the pull request that introduces the finding.
#
# This repository ran CodeQL through GitHub's **default setup** on a weekly
# schedule: a finding landed on `main`, after merge, up to a week after the
# commit that made it. This runs the same analysis on the pull request that
# introduces it, so the alert is attached to that head commit and is there to
# read before anybody merges.
#
# **This job succeeding does not mean it found nothing.** `analyze` uploads the
# SARIF and exits 0 whatever is in it, so the workflow's status proves the
# analysis ran. What refuses the merge is GitHub's code-scanning merge
# protection, a rule on `main`'s ruleset - a repository setting, like the six
# required status checks beside it. `docs/branching.md` records both, and the
# other one this file needs:
#
#   gh api -X DELETE repos/vstorm-co/agenticos/code-scanning/default-setup
#
# Default setup and an advanced workflow cannot both analyse one repository -
# GitHub refuses the advanced upload while default setup is configured - so this
# file **replaces** it rather than joining it.
#
# The weekly full run is kept here on `schedule`, because a query pack updated
# after a merge finds things no pull request could have.
#
# The language list is the one default setup had. `javascript` and `typescript`
# are aliases GitHub resolves to `javascript-typescript`, so they are named once;
# `rust` is the desktop shell (`desktop/src-tauri`), and `actions` is this
# directory, which is what `zizmor` in pre-commit reads from the other side.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 04:17 UTC. Off the hour on purpose: the top of an hour is when every
    # cron-scheduled workflow on GitHub queues at once.
    - cron: "17 4 * * 1"

# Same rule as `ci.yml`, and for the same reason: a pull request cancels its own
# superseded runs, a push to `main` gets a group of its own so no merge commit
# is left without an analysis.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.release.outputs.reuse }}
      evidence_run: ${{ steps.release.outputs.evidence_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release-only changes against a full successful analysis
        id: release
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release_scope.py --workflow codeql.yml >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze ${{ matrix.language }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Measured against default setup's own weekly runs, which finish the Python
    # and JavaScript analyses in about six minutes each. Generous enough for a
    # cold query-pack download, tight enough to end a stall - the same bargain
    # `ci.yml` documents, and `backend/tests/test_codeql_workflow.py` holds the
    # ceiling.
    timeout-minutes: 20
    permissions:
      contents: read
      # What the analysis upload needs. Declared per job rather than at the top
      # so nothing else in this file can write a security event.
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: needs.changes.outputs.reuse != 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Every tree here is analysed from source. Naming it rather than
          # leaving it to the default keeps a compiled language - `rust`, the
          # desktop shell - from asking this job to reproduce its toolchain.
          build-mode: none
          # `security-extended` over the default pack: this is the analysis a
          # client's security review asks about, and the extra queries are the
          # ones that find the things a default pack calls style.
          queries: security-extended

      - name: Perform CodeQL analysis
        if: needs.changes.outputs.reuse != 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results

      - name: Keep the full analysis for equivalent release source
        if: needs.changes.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Restore the proven full analysis
        if: needs.changes.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ needs.changes.outputs.evidence_run }}
          LANGUAGE: ${{ matrix.language }}
        run: gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --name "codeql-sarif-$LANGUAGE" --dir codeql-results

      - name: Publish the equivalent-source results for this commit
        if: needs.changes.outputs.reuse == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: codeql-results
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  checked-source:
    name: Record the checked source
    needs: [changes, analyze]
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The run API reports the PR head SHA, whereas checkout analyzes the
      # synthetic merge SHA. Reuse must prove the tree actually checked.
      - name: Record the checkout commit
        run: printf '%s\n' "$GITHUB_SHA" > checked-source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-source
          path: checked-source.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30
