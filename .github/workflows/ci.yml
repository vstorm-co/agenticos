
name: CI

# Work reaches `main` by pull request from a short-lived branch, so the pull
# request is where these run. The push trigger covers the merge itself - a
# branch CI ignores is a branch whose status badge means nothing.
#
# **`pull_request` carries no `branches:` filter, and that is the point of #359.**
# That filter matches on the *base*, so a pull request stacked on another feature
# branch - which is what two branches touching one file are told to do here - matched
# no trigger at all and ran nothing. Not red, not pending: `gh pr checks` answered
# "no checks reported" and the rollup was empty, which reads as "still starting" to
# anybody who does not go looking. Four pull requests merged that way on 2026-08-06,
# each verified only on somebody's laptop, and the gap closed only when the child was
# retargeted to `main` after the parent merged - the moment nobody waits seven minutes
# for a branch that has looked settled for a day.
#
# Two things make this cheap rather than a doubling of the bill. The `changes` job
# below already skips the three expensive suites a diff cannot affect, and it reads
# `pulls/{n}/files`, which is the diff against *that* pull request's own base - so a
# stacked child is classified on its own changes rather than on its parent's. And the
# `concurrency` group is keyed on `github.ref`, so a stacked branch cancels its own
# superseded runs like any other.
#
# The `push` trigger stays pinned to `main`: a branch push is already covered by its
# pull request, and widening it would run everything twice.
on:
  push:
    branches: [main, master]
  pull_request:

# One run per branch. `CLAUDE.md` asks for a commit and a push per finished piece,
# which is right - but with nothing cancelling, each push started a fresh 24-minute
# matrix and left the previous one running to completion, answering a question
# about a commit nobody was waiting on. 75 of the 369 runs in the first six days of
# August were superseded while still in flight, about 1,800 billed minutes, and
# only 2 runs in that window were ever `cancelled`. See #317.
#
# `main` is deliberately excluded: the push run is what makes the merge history and
# the badge mean anything, and a commit whose CI never finished is worse than a
# minute overspent. `cancel-in-progress: false` is **not** how you exclude it, which
# is the trap this originally fell into: false means *queue*, and GitHub's rule is
# that "any existing pending job or workflow in the same concurrency group will be
# canceled and the new queued job or workflow will take its place". So with one
# group for `main`, merge A running and B pending, C landing cancels B outright and
# B's commit gets no CI at all - at fourteen releases in six days plus feature
# merges, against a ~10 minute `main` run, two merges inside one window is not rare.
#
# So `main` is kept out of the group entirely rather than out of the cancelling:
# `github.run_id` is unique per run, so every push gets a group of its own and
# neither queues nor cancels. Pull requests all resolve to `-pr` and cancel each
# other per `github.ref`, which is the whole point.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for every job. Nothing in this workflow writes anything back:
# the docker job builds with `push: false`, and Codecov uses its own token. A
# job that later needs more should declare it on itself, not here.
permissions:
  contents: read

# **Every job carries a `timeout-minutes`, and #364 is why.** `changes` was the only
# one that did, so the other seven inherited GitHub's default of 360 minutes: one
# stalled job would have held a required status check for six hours with nothing in
# this repository ending it sooner. Nothing has been observed to stall - this is a
# bound on the tail, not a fix for something seen.
#
# Each is set several times the job's observed worst case rather than just above it.
# The bound exists to end a stall, and a timeout tight enough to trim a legitimately
# cold cache is a red build for a reason unrelated to the diff. Measured on run
# 31116003994, a full matrix on `main`: changes 7s, lint 22s, Security Scan 14s,
# docker 2m30s, docs 4m34s, test-frontend 5m08s, test 7m43s, e2e 8m01s.
#
# `backend/tests/test_ci_workflow.py` asserts that a job added later carries one too,
# and that none is so generous it bounds nothing.
jobs:
  changes:
    # Which of the three expensive suites this pull request can provably not
    # affect. `scripts/ci_changed_scope.py` decides, timidly - a path it does not
    # recognise runs everything - and its docstring says why that direction is the
    # only safe one. A skipped job satisfies a required status check (GitHub counts
    # `success`, `skipped` and `neutral`), which is what makes this legal against
    # the six contexts `main`'s ruleset requires; a workflow-level `paths:` filter
    # would instead leave those checks never reporting and block every merge
    # forever, which is the trap named in #317.
    #
    # A job of its own rather than a step inside `lint`, at the cost of the one
    # billed minute GitHub rounds it up to: folding it into `lint` would be free,
    # but it would put `test`, `test-frontend` and `e2e` behind `needs: lint`, so a
    # ruff error would skip all three and hide whatever else was broken until the
    # next push.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block *replaces* the workflow-level one rather than adding to it,
    # so `contents: read` has to be repeated here - this job checks out. Omitting it
    # works on a public repository, where any token can read public content, and
    # breaks on the day #317's premise changes and this repository goes private:
    # a checkout failure that reads like a credentials problem.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out which suites the changed paths require
        id: scope
        # Nothing is emitted on a push, so every downstream `if:` compares against
        # an empty string and runs: a merge to `main` gets the whole matrix.
        #
        # That covers a *skipped step*. It does not cover this *job* failing - a 502
        # from the API, a rate limit, `set -euo pipefail` catching anything - because
        # a failed `needs` skips its dependents without evaluating their `if:` at
        # all, and a skipped required check is a pass. `changes` is not itself one of
        # the six required contexts, so nothing would have blocked: the merge button
        # would go green on a branch where no suite ran. Hence `!cancelled()` on each
        # gated job, which is what makes them run when this one fails.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            > "$RUNNER_TEMP/changed.txt"
          python3 scripts/ci_changed_scope.py "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

  lint:
    # Never gated. It is one billed minute, `make lint-spelling` reads every
    # tracked file rather than a subtree, and a suite that skips is only defensible
    # while something still looks at the whole tree.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          # Caches `~/.cache/uv`, keyed on `**/uv.lock`. Without it every job
          # re-resolved and re-downloaded all 278 locked packages, five times per
          # run across this workflow. See #317.
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # ruff check, ruff format --check, ty, and the two guard scripts - the
      # target, not a second copy of its commands. Every step this job used to
      # spell out was also spelled out in the Makefile, and the pair drifted:
      # `scripts/check_i18n.py` was in `make lint` and never here, so hardcoded
      # copy failed locally and passed the build. Calling the target is how the
      # two stay equal rather than how they are asserted to be equal - and
      # `backend/tests/test_ci_parity.py` catches whatever this still misses.
      - name: Lint, format-check and type-check the backend
        run: make lint-backend

      # codespell over every tracked file. The pre-commit hook reads only the
      # files a commit touches, so until #188 nothing had ever read the tree: a
      # misspelling merged with its file, and the next person to touch that file
      # for an unrelated reason had their commit refused by a word they did not
      # write. This step is what keeps "the whole tree is clean" true.
      - name: Spell-check the whole tree
        run: make lint-spelling

    # The step that used to sit here ran the entire test suite - with no
    # database, in the lint job - to grep its output for `module-not-imported`.
    # That warning belongs to `[tool.coverage.run] source`, and this config
    # selects with `include`, which never emits it: the check could not fail,
    # and it cost a full suite run to prove nothing.
    #
    # `tests/test_coverage_gate.py` asserts what it was reaching for, properly:
    # every include pattern matches a real file, every platform module is
    # gated, and the `[[tool.ty.overrides]]` list has not drifted from it. It
    # runs in the `test` job, where a database exists.

  test:
    needs: changes
    # Two mechanisms, deliberately both. `!= 'false'` rather than `== 'true'` because
    # on a push the `changes` step does not run and the empty output has to mean
    # *run*; `!cancelled()` because a `changes` job that *failed* would otherwise
    # skip this one without the `if:` being read at all - and a skipped required
    # check is a pass, so that is a green merge button over a suite that never ran.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # On the job rather than repeated under each step, which is how the `e2e` job
    # below already does it. Four identical copies is four places to forget one.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Cycle the migration chain forwards and back
        # The only way to know a migration works. Backfills, check constraints
        # and the loud failures they raise cannot be verified by importing the
        # module — they need a database with the previous schema in it. And a
        # downgrade nobody runs is a downgrade that does not work, so the chain
        # goes to base and back rather than only forwards.
        #
        # `make check` does not run this, and that omission is deliberate rather
        # than drift: `downgrade base` here empties a throwaway `test_db`, while
        # on a laptop it points at whatever `backend/.env` says.
        run: make test-migrations

      - name: Verify the models and the migrations still agree
        # `alembic check` fails if the models declare something no migration
        # creates - the gate that catches "edited a model, forgot the
        # migration". `test-migrations` above leaves the database at head, which
        # is what this needs; it never downgrades, so it is safe to run in
        # `make check` too, where `test-migrations` is not.
        run: make db-check

      - name: Run tests with the coverage gate
        # --cov with no argument uses the include list in pyproject.toml: the
        # platform layer, held at 100%. Template-inherited subsystems are
        # reported by the next step but do not gate the build.
        #
        # `COV_REPORT=xml` is the only difference from what `make test` does on a
        # laptop, and it is for Codecov below rather than for the gate.
        run: make test COV_REPORT=xml

      - name: Report coverage of template-inherited code
        # Informational. Holding code we did not design to the platform bar
        # would mean mock-heavy tests that buy a number rather than confidence.
        if: always()
        run: make coverage-all

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # `setup-bun` caches the bun binary, not the packages, so
      # `bun install --frozen-lockfile` re-downloaded every dependency on every
      # run. Bun's global install cache is what makes the second run cheap; the
      # key is the lockfile, so a dependency change invalidates it and nothing
      # else does.
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # eslint (`--max-warnings 0`, because a warning nobody has to fix is a
      # warning everybody learns to scroll past), prettier and tsc. `make lint`
      # ran none of the three until #143, so a type error in a `.tsx` passed
      # locally and stopped the build here.
      - name: Lint, format-check and type-check the frontend
        run: make lint-frontend

      - name: Run unit and integration tests with the coverage gate
        # `test:coverage`, not `test:run`. The gate is the whole point of this
        # step: `test:run` measures nothing and 2909 green tests still owe 100%
        # lines, statements and functions.
        run: make test-frontend-cov

      - name: Build
        # `next build` type-checks the route tree and fails on a server
        # component that cannot render — neither of which tsc or vitest sees.
        run: make build-frontend

  e2e:
    # Split out of test-frontend on purpose. E2E needs Postgres, Redis, Python,
    # uv, a migrated database, a seeded organization and a running backend;
    # linting needs none of that, and making a formatting error wait on a
    # database pull — or hiding it behind a browser timeout — helps nobody.
    needs: changes
    # Exempted from neither half: this job drives the frontend against the
    # backend, so it is only skippable for a change that touches neither.
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # The browser talks to Next, Next proxies to FastAPI, and the chat
      # websocket goes to FastAPI directly — so the backend port has to match
      # what the client bundle was built with. 8000 is the default for both.
      BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --directory backend --dev

      - name: Apply migrations
        run: uv run --directory backend alembic upgrade head

      - name: Seed an organization, a model and a published agent
        # Idempotent, and the fixture the whole suite asserts against: an owner
        # to sign in as, an organization to be scoped to, and the published
        # agent @getting-started.
        #
        # `BOOTSTRAP_API_KEY` is what makes that last part true, and this step ran
        # without it - so bootstrap stopped at "No openai key given", created no
        # `openai default` model profile, and left @getting-started a *draft*.
        # Thirty-seven specs assert against that profile or against a published
        # agent, so the job could not pass however good the specs were.
        #
        # A placeholder is enough, and it is all that is used: the fixture the
        # suite needs is a model profile that exists and an agent that published,
        # not a key that answers. Nothing in this job calls a real provider - the
        # journey spec runs its agent against the stub model server Playwright
        # starts - so no secret is in scope here at all.
        run: uv run --directory backend agenticos cmd bootstrap
        env:
          BOOTSTRAP_API_KEY: sk-e2e-fixture-not-a-real-key

      - name: Start the backend
        # `--ws websockets-sansio` because uvicorn's `auto` picks the legacy
        # websockets implementation, which fails the handshake against
        # websockets >= 14 — and the chat specs need that socket up.
        run: |
          uv run --directory backend uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --ws websockets-sansio \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"

      - name: Wait for the backend to be healthy
        # Polled, not slept. A fixed wait is either too short on a cold runner
        # or wasted on a warm one, and the failure it produces is a browser
        # timeout thirty tests later rather than a message saying the backend
        # never came up.
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Build the frontend
        # Playwright serves this build with `next start`. A dev server would
        # compile each route on first hit, which turns the first visit to every
        # page into a timeout waiting to happen.
        run: bun run build
        working-directory: frontend

      # Chromium is ~170 MB downloaded on every run otherwise. Keyed on the
      # lockfile, because that is what pins the Playwright version the browser
      # has to match - a browser cached against a different version is the kind
      # of failure that reads as a flaky spec.
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        # `--with-deps` still runs: the apt packages Chromium links against live
        # outside the cached directory, and installing them on a hit is seconds.
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        # `webServer` in playwright.config.ts starts `next start` and waits for
        # it. This job used to run with no frontend at all: `webServer` was
        # disabled under CI, so Playwright drove a closed port.
        run: bun run test:e2e
        working-directory: frontend
        env:
          CI: true
          # No provider key here, and none needed. The full journey runs an agent
          # against `e2e/stub-model-server.ts`, an OpenAI-compatible server
          # Playwright starts beside the app - so the one spec covering the seams
          # runs on every push instead of skipping itself in every environment
          # that had no key, which was all of them including this one.

      - name: Upload the Playwright report when a journey fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show the backend log when a journey fails
        # Half of an E2E failure is on the other side of the proxy.
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # This job never audited anything. `uv pip install pip-audit` ran outside a
      # virtualenv and died with "No virtual environment found", so it reported
      # red for a reason unrelated to security - and two further errors were
      # queued behind it: `--require-hashes` is a flag, not a key=value, and
      # `--locked` wants a PEP 751 `pylock.toml` rather than `uv.lock`.
      #
      # What works, and what `make audit` now does: export exactly what the
      # lockfile resolves - which is what a deployment installs - and audit that.
      # It ran only here until #143, so a dependency advisory was something a
      # branch learned about after pushing.
      - name: Audit the locked dependency set for known vulnerabilities
        run: make audit

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # The runtime too, not just mkdocs: the reference pages are generated from
      # the application's own docstrings, so a build without it would either fail
      # to collect them or - worse - quietly render empty pages.
      - name: Install dependencies
        run: uv sync --directory backend --group docs

      - name: Build the documentation
        # `--strict` turns a dead internal link or a page missing from the nav
        # into a failure. Both are things a reader finds and a lenient build
        # ships.
        run: make docs-build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          load: true
          tags: agenticos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agenticos:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
