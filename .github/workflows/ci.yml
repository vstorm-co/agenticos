
name: CI

# `dev` is where work lands before it reaches `main`, so it has to run the same
# checks - a branch CI ignores is a branch whose status badge means nothing.
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# Least privilege for every job. Nothing in this workflow writes anything back:
# the docker job builds with `push: false`, and Codecov uses its own token. A
# job that later needs more should declare it on itself, not here.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run ruff check
        run: uv run --directory backend ruff check app tests cli

      - name: Run ruff format check
        run: uv run --directory backend ruff format app tests cli --check

      - name: Run ty
        run: uv run --directory backend ty check

      # `make lint` runs this too. When CI omits a step the Makefile has, green
      # locally stops meaning green here, which is the whole value of `make check`.
      - name: Check for double backticks
        run: python3 scripts/check_backticks.py

    # The step that used to sit here ran the entire test suite - with no
    # database, in the lint job - to grep its output for `module-not-imported`.
    # That warning belongs to `[tool.coverage.run] source`, and this config
    # selects with `include`, which never emits it: the check could not fail,
    # and it cost a full suite run to prove nothing.
    #
    # `tests/test_coverage_gate.py` asserts what it was reaching for, properly:
    # every include pattern matches a real file, every platform module is
    # gated, and the `[[tool.ty.overrides]]` list has not drifted from it. It
    # runs in the `test` job, where a database exists.

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Apply migrations against a real database
        # The only way to know a migration works. Backfills, check constraints
        # and the loud failures they raise cannot be verified by importing the
        # module — they need a database with the previous schema in it.
        run: uv run --directory backend alembic upgrade head
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Verify migrations roll back
        # A downgrade nobody runs is a downgrade that does not work. Cycling the
        # whole chain catches a missing drop long before an operator needs it.
        run: |
          uv run --directory backend alembic downgrade base
          uv run --directory backend alembic upgrade head
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run tests with the coverage gate
        # --cov with no argument uses the source list in pyproject.toml: the
        # platform layer, held at 100%. Template-inherited subsystems are
        # reported by the next step but do not gate the build.
        run: uv run --directory backend pytest tests/ -v --cov --cov-report=xml
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Report coverage of template-inherited code
        # Informational. Holding code we did not design to the platform bar
        # would mean mock-heavy tests that buy a number rather than confidence.
        if: always()
        run: uv run --directory backend pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=0
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Run lint
        # `bun run lint` is `eslint . --max-warnings 0`. A warning nobody has to
        # fix is a warning everybody learns to scroll past.
        run: bun run lint
        working-directory: frontend

      - name: Check formatting
        run: bunx prettier --check "src/**/*.{ts,tsx}" "e2e/**/*.ts"
        working-directory: frontend

      - name: Run type check
        run: bun run type-check
        working-directory: frontend

      - name: Run unit and integration tests with the coverage gate
        run: bun run test:coverage
        working-directory: frontend

      - name: Build
        # `next build` type-checks the route tree and fails on a server
        # component that cannot render — neither of which tsc or vitest sees.
        run: bun run build
        working-directory: frontend

  e2e:
    # Split out of test-frontend on purpose. E2E needs Postgres, Redis, Python,
    # uv, a migrated database, a seeded organization and a running backend;
    # linting needs none of that, and making a formatting error wait on a
    # database pull — or hiding it behind a browser timeout — helps nobody.
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # The browser talks to Next, Next proxies to FastAPI, and the chat
      # websocket goes to FastAPI directly — so the backend port has to match
      # what the client bundle was built with. 8000 is the default for both.
      BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --directory backend --dev

      - name: Apply migrations
        run: uv run --directory backend alembic upgrade head

      - name: Seed an organization, a model and a published agent
        # Idempotent, and the fixture the whole suite asserts against: an owner
        # to sign in as, an organization to be scoped to, and the published
        # agent @getting-started.
        #
        # `BOOTSTRAP_API_KEY` is what makes that last part true, and this step ran
        # without it - so bootstrap stopped at "No openai key given", created no
        # `openai default` model profile, and left @getting-started a *draft*.
        # Thirty-seven specs assert against that profile or against a published
        # agent, so the job could not pass however good the specs were.
        #
        # A placeholder is enough, and it is all that is used: the fixture the
        # suite needs is a model profile that exists and an agent that published,
        # not a key that answers. Nothing in this job calls a real provider - the
        # journey spec runs its agent against the stub model server Playwright
        # starts - so no secret is in scope here at all.
        run: uv run --directory backend agenticos cmd bootstrap
        env:
          BOOTSTRAP_API_KEY: sk-e2e-fixture-not-a-real-key

      - name: Start the backend
        # `--ws websockets-sansio` because uvicorn's `auto` picks the legacy
        # websockets implementation, which fails the handshake against
        # websockets >= 14 — and the chat specs need that socket up.
        run: |
          uv run --directory backend uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --ws websockets-sansio \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"

      - name: Wait for the backend to be healthy
        # Polled, not slept. A fixed wait is either too short on a cold runner
        # or wasted on a warm one, and the failure it produces is a browser
        # timeout thirty tests later rather than a message saying the backend
        # never came up.
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Build the frontend
        # Playwright serves this build with `next start`. A dev server would
        # compile each route on first hit, which turns the first visit to every
        # page into a timeout waiting to happen.
        run: bun run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        # `webServer` in playwright.config.ts starts `next start` and waits for
        # it. This job used to run with no frontend at all: `webServer` was
        # disabled under CI, so Playwright drove a closed port.
        run: bun run test:e2e
        working-directory: frontend
        env:
          CI: true
          # No provider key here, and none needed. The full journey runs an agent
          # against `e2e/stub-model-server.ts`, an OpenAI-compatible server
          # Playwright starts beside the app - so the one spec covering the seams
          # runs on every push instead of skipping itself in every environment
          # that had no key, which was all of them including this one.

      - name: Upload the Playwright report when a journey fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show the backend log when a journey fails
        # Half of an E2E failure is on the other side of the proxy.
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # This job never audited anything. `uv pip install pip-audit` ran outside a
      # virtualenv and died with "No virtual environment found", so it reported
      # red for a reason unrelated to security - and two further errors were
      # queued behind it: `--require-hashes` is a flag, not a key=value, and
      # `--locked` wants a PEP 751 `pylock.toml` rather than `uv.lock`.
      #
      # What works: export exactly what the lockfile resolves - which is what a
      # deployment installs - and audit that. The export is fully pinned, so
      # `--no-deps --disable-pip` skips a resolution round-trip that pip-audit
      # would otherwise do in a throwaway virtualenv.
      - name: Export the locked dependency set
        run: uv export --frozen --no-emit-project --no-hashes -o requirements-audit.txt
        working-directory: backend

      - name: Audit dependencies for known vulnerabilities
        run: >-
          uv tool run pip-audit -r requirements-audit.txt
          --no-deps --disable-pip --progress-spinner=off
        working-directory: backend

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # The runtime too, not just mkdocs: the reference pages are generated from
      # the application's own docstrings, so a build without it would either fail
      # to collect them or - worse - quietly render empty pages.
      - name: Install dependencies
        run: uv sync --directory backend --group docs

      - name: Build the documentation
        # `--strict` turns a dead internal link or a page missing from the nav
        # into a failure. Both are things a reader finds and a lenient build
        # ships.
        run: uv run --directory backend --group docs mkdocs build -f ../mkdocs.yml --strict

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          load: true
          tags: agenticos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agenticos:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
