
name: CI

# Work reaches `main` by pull request from a short-lived branch, so the pull
# request is where these run. The push trigger covers the merge itself - a
# branch CI ignores is a branch whose status badge means nothing.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege for every job. Nothing in this workflow writes anything back:
# the docker job builds with `push: false`, and Codecov uses its own token. A
# job that later needs more should declare it on itself, not here.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # ruff check, ruff format --check, ty, and the two guard scripts - the
      # target, not a second copy of its commands. Every step this job used to
      # spell out was also spelled out in the Makefile, and the pair drifted:
      # `scripts/check_i18n.py` was in `make lint` and never here, so hardcoded
      # copy failed locally and passed the build. Calling the target is how the
      # two stay equal rather than how they are asserted to be equal - and
      # `backend/tests/test_ci_parity.py` catches whatever this still misses.
      - name: Lint, format-check and type-check the backend
        run: make lint-backend

      # codespell over every tracked file. The pre-commit hook reads only the
      # files a commit touches, so until #188 nothing had ever read the tree: a
      # misspelling merged with its file, and the next person to touch that file
      # for an unrelated reason had their commit refused by a word they did not
      # write. This step is what keeps "the whole tree is clean" true.
      - name: Spell-check the whole tree
        run: make lint-spelling

    # The step that used to sit here ran the entire test suite - with no
    # database, in the lint job - to grep its output for `module-not-imported`.
    # That warning belongs to `[tool.coverage.run] source`, and this config
    # selects with `include`, which never emits it: the check could not fail,
    # and it cost a full suite run to prove nothing.
    #
    # `tests/test_coverage_gate.py` asserts what it was reaching for, properly:
    # every include pattern matches a real file, every platform module is
    # gated, and the `[[tool.ty.overrides]]` list has not drifted from it. It
    # runs in the `test` job, where a database exists.

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # On the job rather than repeated under each step, which is how the `e2e` job
    # below already does it. Four identical copies is four places to forget one.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Cycle the migration chain forwards and back
        # The only way to know a migration works. Backfills, check constraints
        # and the loud failures they raise cannot be verified by importing the
        # module — they need a database with the previous schema in it. And a
        # downgrade nobody runs is a downgrade that does not work, so the chain
        # goes to base and back rather than only forwards.
        #
        # `make check` does not run this, and that omission is deliberate rather
        # than drift: `downgrade base` here empties a throwaway `test_db`, while
        # on a laptop it points at whatever `backend/.env` says.
        run: make test-migrations

      - name: Verify the models and the migrations still agree
        # `alembic check` fails if the models declare something no migration
        # creates - the gate that catches "edited a model, forgot the
        # migration". `test-migrations` above leaves the database at head, which
        # is what this needs; it never downgrades, so it is safe to run in
        # `make check` too, where `test-migrations` is not.
        run: make db-check

      - name: Run tests with the coverage gate
        # --cov with no argument uses the include list in pyproject.toml: the
        # platform layer, held at 100%. Template-inherited subsystems are
        # reported by the next step but do not gate the build.
        #
        # `COV_REPORT=xml` is the only difference from what `make test` does on a
        # laptop, and it is for Codecov below rather than for the gate.
        run: make test COV_REPORT=xml

      - name: Report coverage of template-inherited code
        # Informational. Holding code we did not design to the platform bar
        # would mean mock-heavy tests that buy a number rather than confidence.
        if: always()
        run: make coverage-all

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # eslint (`--max-warnings 0`, because a warning nobody has to fix is a
      # warning everybody learns to scroll past), prettier and tsc. `make lint`
      # ran none of the three until #143, so a type error in a `.tsx` passed
      # locally and stopped the build here.
      - name: Lint, format-check and type-check the frontend
        run: make lint-frontend

      - name: Run unit and integration tests with the coverage gate
        # `test:coverage`, not `test:run`. The gate is the whole point of this
        # step: `test:run` measures nothing and 2909 green tests still owe 100%
        # lines, statements and functions.
        run: make test-frontend-cov

      - name: Build
        # `next build` type-checks the route tree and fails on a server
        # component that cannot render — neither of which tsc or vitest sees.
        run: make build-frontend

  e2e:
    # Split out of test-frontend on purpose. E2E needs Postgres, Redis, Python,
    # uv, a migrated database, a seeded organization and a running backend;
    # linting needs none of that, and making a formatting error wait on a
    # database pull — or hiding it behind a browser timeout — helps nobody.
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres: the RAG store runs
        # `CREATE EXTENSION IF NOT EXISTS vector` the first time a collection
        # is written to, and stock postgres answers `extension "vector" is
        # not available` — so an ingestion test would 500 before asserting
        # anything, and the E2E upload journey could never run at all.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e2e_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # The browser talks to Next, Next proxies to FastAPI, and the chat
      # websocket goes to FastAPI directly — so the backend port has to match
      # what the client bundle was built with. 8000 is the default for both.
      BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --directory backend --dev

      - name: Apply migrations
        run: uv run --directory backend alembic upgrade head

      - name: Seed an organization, a model and a published agent
        # Idempotent, and the fixture the whole suite asserts against: an owner
        # to sign in as, an organization to be scoped to, and the published
        # agent @getting-started.
        #
        # `BOOTSTRAP_API_KEY` is what makes that last part true, and this step ran
        # without it - so bootstrap stopped at "No openai key given", created no
        # `openai default` model profile, and left @getting-started a *draft*.
        # Thirty-seven specs assert against that profile or against a published
        # agent, so the job could not pass however good the specs were.
        #
        # A placeholder is enough, and it is all that is used: the fixture the
        # suite needs is a model profile that exists and an agent that published,
        # not a key that answers. Nothing in this job calls a real provider - the
        # journey spec runs its agent against the stub model server Playwright
        # starts - so no secret is in scope here at all.
        run: uv run --directory backend agenticos cmd bootstrap
        env:
          BOOTSTRAP_API_KEY: sk-e2e-fixture-not-a-real-key

      - name: Start the backend
        # `--ws websockets-sansio` because uvicorn's `auto` picks the legacy
        # websockets implementation, which fails the handshake against
        # websockets >= 14 — and the chat specs need that socket up.
        run: |
          uv run --directory backend uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --ws websockets-sansio \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"

      - name: Wait for the backend to be healthy
        # Polled, not slept. A fixed wait is either too short on a cold runner
        # or wasted on a warm one, and the failure it produces is a browser
        # timeout thirty tests later rather than a message saying the backend
        # never came up.
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "backend healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Build the frontend
        # Playwright serves this build with `next start`. A dev server would
        # compile each route on first hit, which turns the first visit to every
        # page into a timeout waiting to happen.
        run: bun run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        # `webServer` in playwright.config.ts starts `next start` and waits for
        # it. This job used to run with no frontend at all: `webServer` was
        # disabled under CI, so Playwright drove a closed port.
        run: bun run test:e2e
        working-directory: frontend
        env:
          CI: true
          # No provider key here, and none needed. The full journey runs an agent
          # against `e2e/stub-model-server.ts`, an OpenAI-compatible server
          # Playwright starts beside the app - so the one spec covering the seams
          # runs on every push instead of skipping itself in every environment
          # that had no key, which was all of them including this one.

      - name: Upload the Playwright report when a journey fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show the backend log when a journey fails
        # Half of an E2E failure is on the other side of the proxy.
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # This job never audited anything. `uv pip install pip-audit` ran outside a
      # virtualenv and died with "No virtual environment found", so it reported
      # red for a reason unrelated to security - and two further errors were
      # queued behind it: `--require-hashes` is a flag, not a key=value, and
      # `--locked` wants a PEP 751 `pylock.toml` rather than `uv.lock`.
      #
      # What works, and what `make audit` now does: export exactly what the
      # lockfile resolves - which is what a deployment installs - and audit that.
      # It ran only here until #143, so a dependency advisory was something a
      # branch learned about after pushing.
      - name: Audit the locked dependency set for known vulnerabilities
        run: make audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # The runtime too, not just mkdocs: the reference pages are generated from
      # the application's own docstrings, so a build without it would either fail
      # to collect them or - worse - quietly render empty pages.
      - name: Install dependencies
        run: uv sync --directory backend --group docs

      - name: Build the documentation
        # `--strict` turns a dead internal link or a page missing from the nav
        # into a failure. Both are things a reader finds and a lenient build
        # ships.
        run: make docs-build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          load: true
          tags: agenticos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agenticos:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
