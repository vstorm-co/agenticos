# Publish the two images the compose files pull.
#
#   ghcr.io/vstorm-co/agenticos-backend    the API, the Prefect runner, the migrations
#   ghcr.io/vstorm-co/agenticos-frontend   the console
#
# A `v*` tag publishes `<version>` and `latest`; a push to `main` publishes
# `edge`; both publish `sha-<short>`, which is what `scripts/deploy.sh` pins a
# host to. Each image is built for amd64 and arm64 on a runner of that
# architecture - QEMU would take twenty minutes over LibreOffice - pushed by
# digest, and joined into one manifest list per tag by the `publish` job.
#
# Separate from `ci.yml` on purpose, the way `docs.yml` is. CI answers a pull
# request; this answers a commit that is already on `main`, which the ruleset
# only lets there after CI has passed - so gating the build on `lint` and `test`
# again would run them a second time on the same commit. It replaces the `docker`
# job that used to build the backend on `main` with `push: false` for Trivy to
# scan; the scan is the last job here, over the image that was actually pushed.
#
# **Only a commit already on `main` is published.** `resolve` refuses anything
# else, so a `v*` tag pushed from a branch cannot move `latest` past the
# pull-request boundary, and a dispatch on a branch publishes nothing. A release
# tag on a commit `main` already built is not built again: `sha-<short>` is in
# the registry, and `publish` gives that manifest list its version and `latest`
# - seconds rather than minutes, and the digests a deployment pinned to are the
# ones the release names.
#
# **The first publish creates each package private.** GHCR makes a new package
# private until somebody opens its settings and changes that, and nobody inside
# the organization can tell from inside it - every pull they try is
# authenticated. #1512 found the sandbox image in that state after a month.
# After the first run: `docker manifest inspect ghcr.io/vstorm-co/agenticos-backend:edge`
# from a shell that is not logged in, and the same for the frontend.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # For publishing `edge` before `main` has moved, for re-running a publish whose
  # runner died, and - with `sha` - for a commit that has no images: one whose
  # run was lost, or one older than this workflow, which a rollback through
  # `scripts/deploy.sh` needs. A backfill gets its `sha-<short>` tag and nothing
  # that moves.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to publish (default: the ref this is run from). It has to be on main already."
        required: false
        type: string

# Read-only by default; the two jobs that push declare `packages: write` on
# themselves. There is no `pull_request` trigger, deliberately: a fork's pull
# request must never be able to publish under this organization's name.
permissions:
  contents: read

# One group per *commit*, never per ref. A group per ref with
# `cancel-in-progress: false` is one running and one pending run: merge A
# running, B pending, C landing cancels B - GitHub's rule, the one `ci.yml`
# quotes and keys `main` on `run_id` to avoid - and B's commit then has no
# `sha-` images for `scripts/deploy.sh` to pull, which closes both its deploy
# and the rollback to it. Runs for different commits share nothing but the
# moving tags, and `publish` checks `main` before it moves `edge`. The group
# still serialises two runs of the *same* commit - a push and a dispatch re-run
# - which is the one collision worth preventing.
concurrency:
  group: images-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/vstorm-co/agenticos

jobs:
  # Which commit, which tags, and whether anything needs building. Deliberately
  # before any job holding `packages: write`, and the only one that reads git:
  # what `build` checks out and `publish` names is a commit this job has
  # already proved is on `main`.
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      short: ${{ steps.pin.outputs.short }}
      tags: ${{ steps.pin.outputs.tags }}
      edge: ${{ steps.pin.outputs.edge }}
      build: ${{ steps.pin.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, or `merge-base` cannot answer.
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `sha-<short>` on every event. `edge` for `main`, decided finally in
      # `publish` against where `main` is by then. The version and `latest` for a
      # `v*` tag - `latest` only for a plain `x.y.z`, the way metadata-action's
      # `latest=auto` would have it, so a pre-release never becomes the default
      # pull. A backfill (`sha` given) gets the `sha-` tag alone: a tag that moves
      # belongs to the event that would have moved it.
      - name: Pin it
        id: pin
        env:
          REF: ${{ inputs.sha || github.sha }}
          BACKFILL: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "$REF^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$REF ($sha) is not on main - only merged commits are published" >&2
            exit 1
          fi
          short=${sha:0:7}
          tags="sha-$short"
          edge=false
          if [ -z "$BACKFILL" ]; then
            case "$GITHUB_REF" in
              refs/heads/main) edge=true ;;
              refs/tags/v*)
                version=${GITHUB_REF#refs/tags/v}
                tags="$tags $version"
                if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags="$tags latest"; fi
                ;;
            esac
          fi
          build=false
          for image in backend frontend; do
            if ! docker buildx imagetools inspect "$IMAGE_PREFIX-$image:sha-$short" >/dev/null 2>&1; then
              build=true
            fi
          done
          {
            echo "sha=$sha"
            echo "short=$short"
            echo "tags=$tags"
            echo "edge=$edge"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $(git --no-pager log --oneline -1 "$sha") as: $tags (edge: $edge, build: $build)"

  build:
    name: build ${{ matrix.image }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    # The backend's arm64 build installs LibreOffice and Tesseract from Debian's
    # mirrors on a cold cache; measured well under this, but a bound is for the
    # stall, not the median (#364).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          # The backend's context is the repository root, so that `emails/compiled/`
          # can be copied in beside the application - backend/Dockerfile says why.
          - image: backend
            context: .
            file: backend/Dockerfile
          - image: frontend
            context: ./frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. The tags are `resolve`'s, applied once in `publish` where the
      # four digests are joined; here each build pushes by digest and nothing else.
      - name: Read the image's labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # One cache scope per image and architecture, or the four builds evict
          # each other's layers from the one 10 GB store.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The digest travels to `publish` as an empty file named after it, which is
      # what `imagetools create` reads back with a glob - the recipe from Docker's
      # own multi-platform documentation.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [resolve, build]
    # Runs when `build` succeeded *or was skipped* because the commit's images
    # already exist; never when it failed, so a tag is never given half a
    # manifest list.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sources are the four digests when this run built them, and the
      # commit's existing `sha-` manifest list when it did not. `edge` is decided
      # here, against `main` as it is *now*: runs are one per commit and do not
      # queue, so a run for an older commit that finishes last must not move
      # `edge` back onto it.
      - name: Join the digests into one manifest list per tag
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
          TAGS: ${{ needs.resolve.outputs.tags }}
          EDGE: ${{ needs.resolve.outputs.edge }}
          BUILT: ${{ needs.build.result == 'success' }}
        run: |
          set -euo pipefail
          tags=()
          for tag in $TAGS; do tags+=(-t "$IMAGE:$tag"); done
          if [ "$EDGE" = true ]; then
            head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
            if [ "$head" = "$SHA" ]; then
              tags+=(-t "$IMAGE:edge")
            else
              echo "main has moved on to $head; leaving edge where it is"
            fi
          fi
          refs=()
          if [ "$BUILT" = true ]; then
            for digest in "$RUNNER_TEMP"/digests/*; do refs+=("$IMAGE@sha256:$(basename "$digest")"); done
          else
            refs+=("$IMAGE:sha-$SHORT")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Show what was published
        env:
          REF: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ needs.resolve.outputs.short }}
        run: docker buildx imagetools inspect "$REF"

  scan:
    name: scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, publish]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Informational, as it was in `ci.yml`: `exit-code: 0` reports and does not
      # fail. Gating a publish on the base image's CVE count is a decision for
      # #1415, which owns the SBOM and the rest of what a release attests to.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The `sha-` tag, because it is the one name every event publishes.
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ needs.resolve.outputs.short }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
