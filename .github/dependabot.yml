# Dependency updates.
#
# The four frameworks this platform is built out of - FastAPI, Pydantic AI,
# Logfire and genai-prices - are grouped and scheduled weekly on their own, apart
# from everything else. They move fast, this codebase is meant to track them, and
# genai-prices *is* the model price snapshot: an old one means budgets computed
# from stale prices, which is a correctness bug rather than a maintenance chore.
#
# Everything else batches monthly. A PR per patch bump to a transitive
# dependency is a PR nobody reads.
#
# `framework-freshness.yml` runs the same upgrade on a schedule and reports what
# breaks, so a red Dependabot PR is rarely the first anyone hears of it.

version: 2

updates:
  # No cooldown here, deliberately. A cooldown is per-ecosystem rather than
  # per-group, so any delay on `uv` also delays the four frameworks it groups - and
  # a stale `genai-prices` means budgets computed from stale prices, which is a
  # correctness bug rather than a maintenance chore. The freshness workflow is
  # what covers the risk a cooldown would: it runs the same upgrade on a
  # schedule and reports what breaks.
  - package-ecosystem: uv # zizmor: ignore[dependabot-cooldown]
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      # The two wildcards are load-bearing; the rest are exact on purpose.
      #
      # A pattern is matched against the dependency as written, and exactly two
      # of these are written with extras - `pydantic-ai-slim[openrouter,...]`
      # and `logfire[fastapi,asyncpg,...]`. Without a wildcard they matched
      # nothing, so this group never opened a single pull request and the
      # runtime this platform is built on rode in `backend-everything-else`
      # for months, majors included.
      #
      # `fastapi` stays exact for the opposite reason: `fastapi*` also captures
      # `fastapi-cache2`, which is a cache library and has nothing to do with
      # the frameworks this group exists to isolate.
      agent-frameworks:
        applies-to: version-updates
        patterns:
          - fastapi
          - pydantic-ai-slim*
          - pydantic-ai-skills
          - pydantic-graph
          - logfire*
          - genai-prices
      # No `update-types` filter: majors included. Holding one back does not avoid
      # the upgrade, it only delays it until the jump is several versions wide and
      # nobody remembers what changed. CI runs the whole suite on the PR, which is
      # where a breaking major should be discovered.
      backend-everything-else:
        applies-to: version-updates
        patterns: ["*"]
        # Must mirror the group above exactly, wildcards included: an exclusion
        # that does not match is an exclusion that silently does nothing.
        exclude-patterns:
          - fastapi
          - pydantic-ai-slim*
          - pydantic-ai-skills
          - pydantic-graph
          - logfire*
          - genai-prices

  # A week before a release is offered. Nothing here is read the day it lands, so
  # the delay costs nothing and skips the versions that get yanked within hours.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      next:
        applies-to: version-updates
        patterns: [next, react, react-dom, "@types/react", "@types/react-dom"]
      # Majors included here too, for the same reason as the backend group.
      frontend-everything-else:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: [next, react, react-dom, "@types/react", "@types/react-dom"]
    cooldown:
      default-days: 7

  # The workflows pin every action to a commit SHA, which is what makes this
  # entry necessary rather than optional: a SHA never floats to a security fix on
  # its own. Dependabot rewrites the SHA and keeps the `# vN` comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    cooldown:
      default-days: 7
