# The frontend, locally. `make dev-frontend`.
#
#   docker compose -f docker-compose.frontend.yml up -d
#
# Start the backend first (`make dev`). This container reaches it through the
# host gateway rather than the compose network, because the browser also has to
# reach it — and the browser is on the host, so one address has to work for both.
#
# One file per environment, matching the backend set:
#   docker-compose.frontend.yml        local
#   docker-compose-dev.frontend.yml    the dev server
#   docker-compose-prod.frontend.yml   production

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time. The
        # browser runs on the host, so it reaches the backend on localhost.
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
        - NEXT_PUBLIC_SITE_URL=http://localhost:3000
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=50
        - NEXT_PUBLIC_OAUTH_PROVIDERS=google
        - NEXT_PUBLIC_RAG_ENABLED=true
    container_name: agenticos_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_RAG_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # The oven/bun image has no curl/wget, so probe with bun's built-in fetch.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
