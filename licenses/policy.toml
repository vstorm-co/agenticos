obligations = "Network copyleft: a deployment that modifies the platform and serves it over a network must offer its modified source to those users (AGPL-3.0 s.13). The alternative Artifex sells is a commercial licence."
fulfilled_by = ""
tracked_in = "https://github.com/vstorm-co/agenticos/issues/1602"

[review.python."text-unidecode"]
license = "Artistic-1.0-Perl OR GPL-2.0-or-later"
status = "accepted"
obligations = "Dual-licensed; taken under the Artistic License: keep the copyright notice and the licence text with the distribution, do not misrepresent the package."
fulfilled_by = "Unmodified; the wheel's LICENSE.txt ships in the image; named with its source in THIRD_PARTY_NOTICES.md."

