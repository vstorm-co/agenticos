# Licence decisions read by scripts/license_inventory.py (docs/licenses.md).
#
# Two kinds of entry, both keyed by ecosystem and package name:
#
#   [overrides.<python|npm>."<name>"]  the licence a person determined for a
#       component whose own metadata does not name one readably, with the
#       evidence they read. The script reports the component as unknown until
#       an entry exists; it never guesses.
#
#   [notices.<python|npm>."<name>"]  the copyright holder a person found for a
#       package that ships no licence file and names no author in its own
#       metadata - the one case where nothing in the package can be copied or
#       quoted to attribute it. The frontend image's collector writes the licence
#       text and the manifest's attribution beside such a package; this entry is
#       what the notices carry in its place.
#
#   [review.<python|npm>."<name>"]  the decision for a component under a licence
#       in REVIEW_FAMILIES - copyleft, share-alike, or not open source. `license`
#       is the expression that was reviewed, so an upgrade that changes it fails
#       the check and reopens the question. `status` is `accepted`, with
#       `fulfilled_by` saying how the obligation is met, or `open`, with
#       `tracked_in` pointing at the issue that owns the decision.
#
# An entry for a component the lockfiles no longer resolve fails the check too:
# a decision about nothing is clutter that reads as coverage.

[overrides.python."text-unidecode"]
license = "Artistic-1.0-Perl OR GPL-2.0-or-later"
evidence = "text_unidecode-1.3.dist-info/LICENSE.txt: 'redistribute it and/or modify it under the terms of either: GPL or GPLv2+, or Artistic License'; the metadata's License field says only 'Artistic License'"

[overrides.python."uritemplate"]
license = "BSD-3-Clause OR Apache-2.0"
evidence = "uritemplate-4.2.0.dist-info/licenses/LICENSE: 'made available under the terms of either of the licenses found in LICENSE.APACHE or LICENSE.BSD'; the License field says 'BSD 3-Clause OR Apache-2.0' in non-SPDX spelling"

[notices.npm."client-only"]
holder = "Meta Platforms, Inc. and affiliates"
evidence = "client-only 0.0.1 names no author; its package.json points at reactjs.org and facebook/react, and the React repository's LICENSE is MIT, Copyright (c) Meta Platforms, Inc. and affiliates"

[notices.npm."@next/swc-linux-x64-gnu"]
holder = "Vercel, Inc."
evidence = "The platform build of Next.js's compiler names no author and ships no licence file; it is published from https://github.com/vercel/next.js, whose LICENSE is MIT, Copyright (c) 2025 Vercel, Inc."

[notices.npm."@next/swc-linux-arm64-gnu"]
holder = "Vercel, Inc."
evidence = "As for @next/swc-linux-x64-gnu: the arm64 build from the same repository"

[notices.python."pydantic-monty"]
holder = "Pydantic Services Inc."
evidence = "The wheel names no author; its Project-URL is https://github.com/pydantic/monty, whose LICENSE is MIT, Copyright (c) Pydantic Services Inc. 2026 to present"

[notices.python."pydantic-monty-client"]
holder = "Pydantic Services Inc."
evidence = "As for pydantic-monty: the same repository and LICENSE"

[notices.python."pydantic-monty-runtime"]
holder = "Pydantic Services Inc."
evidence = "As for pydantic-monty: the same repository and LICENSE"

[review.python."psycopg2-binary"]
license = "LGPL-3.0-or-later"
status = "accepted"
obligations = "Ship the licence text, keep the library replaceable, make its source available. Used only by Alembic's synchronous engine, unmodified, as a separately installed wheel."
fulfilled_by = "The wheel's LICENSE is in the image under its dist-info; the wheel is a separate file a deployment can replace; source at https://github.com/psycopg/psycopg2."

