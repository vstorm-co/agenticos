# Components no lockfile knows, read by scripts/license_inventory.py and rendered
# into THIRD_PARTY_NOTICES.md beside the generated rows (docs/licenses.md).
#
# One [[component]] per item, every field required:
#
#   name, version, kind, source   what it is and where it comes from
#   license                       free text on purpose - a Debian base image is
#                                 hundreds of packages under dozens of licences,
#                                 and one identifier would be the blanket claim
#                                 the review exists to avoid
#   status                        `accepted` (obligations met, say how in
#                                 `fulfilled_by`), `open` (tracked_in an issue) or
#                                 `deployment-review` (a deployment chooses it and
#                                 reviews its own choice; the notices say what to
#                                 look at)
#   obligations                   what the licence asks of a distributor or user
#
# Versions here are what the Dockerfiles and compose files name. When one of
# those moves, this file moves with it - `scripts/docs_drift.py` reminds.

# Images the three published containers are built from

[[component]]
name = "python (Docker Official Image)"
version = "3.15-slim (Debian)"
kind = "runtime image, backend"
license = "Python: PSF-2.0. Debian base: each package under its own licence (GPL-2.0, GPL-3.0, LGPL-2.1, MIT, BSD and others)."
source = "https://hub.docker.com/_/python"
status = "accepted"
obligations = "Ship licence texts and, for GPL and LGPL packages in the base, make their corresponding source available to recipients of the image."
fulfilled_by = "Debian keeps every package's licence under /usr/share/doc/<package>/copyright in the image and publishes the matching source packages (apt-get source; https://snapshot.debian.org). The image is distributed unmodified apart from the packages listed below; the per-release SBOM (#1415) records the exact package set."

