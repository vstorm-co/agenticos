# Components no lockfile knows, read by scripts/license_inventory.py and rendered
# into THIRD_PARTY_NOTICES.md beside the generated rows (docs/licenses.md).
#
# One [[component]] per item, every field required:
#
#   name, version, kind, source   what it is and where it comes from
#   license                       free text on purpose - a Debian base image is
#                                 hundreds of packages under dozens of licences,
#                                 and one identifier would be the blanket claim
#                                 the review exists to avoid
#   status                        `accepted` (obligations met, say how in
#                                 `fulfilled_by`), `open` (tracked_in an issue) or
#                                 `deployment-review` (a deployment chooses it and
#                                 reviews its own choice; the notices say what to
#                                 look at)
#   obligations                   what the licence asks of a distributor or user
#
# Versions here are what the Dockerfiles and compose files name. When one of
# those moves, this file moves with it - `scripts/docs_drift.py` reminds.

# Images the two published containers are built from

[[component]]
name = "python (Docker Official Image)"
version = "3.12-slim (Debian)"
kind = "runtime image, backend"
license = "Python: PSF-2.0. Debian base: each package under its own licence (GPL-2.0, GPL-3.0, LGPL-2.1, MIT, BSD and others)."
source = "https://hub.docker.com/_/python"
status = "accepted"
obligations = "Ship licence texts and, for GPL and LGPL packages in the base, make their corresponding source available to recipients of the image."
fulfilled_by = "Debian keeps every package's licence under /usr/share/doc/<package>/copyright in the image and publishes the matching source packages (apt-get source; https://snapshot.debian.org). The image is distributed unmodified apart from the packages listed below; the per-release SBOM (#1415) records the exact package set."

[[component]]
name = "libreoffice-core, libreoffice-writer, libreoffice-calc, libreoffice-impress (Debian packages)"
version = "as pinned by the base image's Debian release"
kind = "system package, backend image"
license = "MPL-2.0 (LibreOffice), with parts under LGPL-3.0-or-later and Apache-2.0"
source = "https://www.libreoffice.org/about-us/licenses/"
status = "accepted"
obligations = "MPL and LGPL: licence texts ship with the binaries and their source is available; used unmodified, invoked as a separate process by LiteParse for office-format conversion."
fulfilled_by = "Debian's /usr/share/doc/libreoffice-*/copyright is in the image; source through Debian's source packages; no modification."

[[component]]
name = "tesseract-ocr, tesseract-ocr-eng, tesseract-ocr-pol (Debian packages)"
version = "as pinned by the base image's Debian release"
kind = "system package, backend image"
license = "Apache-2.0 (engine and language data)"
source = "https://github.com/tesseract-ocr/tesseract"
status = "accepted"
obligations = "Attribution and the licence text."
fulfilled_by = "Debian's /usr/share/doc/tesseract-ocr*/copyright is in the image; named here."

[[component]]
name = "oven/bun (Docker image)"
version = "1 (Debian)"
kind = "runtime image, frontend"
license = "Bun: MIT (with bundled components under their own licences, listed in Bun's LICENSE.md). Debian base: as for the python image."
source = "https://hub.docker.com/r/oven/bun"
status = "accepted"
obligations = "Ship licence texts; for GPL and LGPL packages in the base, make their corresponding source available to recipients of the image."
fulfilled_by = "As for the python image: /usr/share/doc/*/copyright in the image, Debian's source packages, the per-release SBOM (#1415)."

[[component]]
name = "ghcr.io/astral-sh/uv (build stage only)"
version = "latest"
kind = "build tool, not in the published image"
license = "Apache-2.0 OR MIT"
source = "https://github.com/astral-sh/uv"
status = "accepted"
obligations = "None for the published image: the binary is copied into the builder stage and installs the wheels; it is not in the final layer."
fulfilled_by = "Not distributed."

# Bundled assets

[[component]]
name = "Inter, Bricolage Grotesque, Geist Mono (web fonts)"
version = "Google Fonts v20, v9, v6 (frontend/src/app/fonts/README.md)"
kind = "font, frontend image"
license = "OFL-1.1"
source = "https://fonts.google.com"
status = "accepted"
obligations = "Distribute with the licence text and each family's copyright notice; do not sell the fonts on their own; do not use the reserved font names for a modified version."
fulfilled_by = "frontend/src/app/fonts/OFL.txt carries the licence and all three copyright notices and is in the repository; the fonts are served unmodified under their own names."

[[component]]
name = "Brand marks in frontend/src/lib/brand-glyphs.generated.ts"
version = "as generated by frontend/scripts/gen-brand-icons.ts"
kind = "icons, frontend image"
license = "Simple Icons: CC0-1.0. Font Awesome Free icons: CC-BY-4.0. @lobehub/icons: MIT. The marks themselves are their owners' trademarks."
source = "https://simpleicons.org, https://fontawesome.com/license, https://icons.lobehub.com"
status = "accepted"
obligations = "CC-BY-4.0 attribution for the Font Awesome icons; MIT notice for @lobehub/icons; trademark use limited to identifying the product each mark stands for."
fulfilled_by = "The NOTICE file names the three sources, their licences and the trademark position; the console draws a mark only next to the product it identifies."

# Data files the backend bundles

[[component]]
name = "backend/app/core/catalog/mcp_registry.json"
version = "a snapshot refreshed by `agenticos cmd mcp-registry-sync`"
kind = "data, backend image"
license = "Server names, descriptions and URLs published to the Official MCP Registry by their publishers; the registry software is MIT."
source = "https://registry.modelcontextprotocol.io"
status = "accepted"
obligations = "Attribution to the registry; the snapshot is redistributed as catalogue metadata and each entry links to its publisher."
fulfilled_by = "app/services/mcp_registry.py names the source; the console shows each server's publisher description verbatim with its URL."

