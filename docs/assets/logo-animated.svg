<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="AgenticOS">
  <title>AgenticOS</title>
  <style>
    .ao-float, .ao-body, .ao-eyes, .ao-look { transform-box: fill-box; transform-origin: center; }
    .ao-float { animation: ao-float 3.6s ease-in-out infinite; }
    .ao-body { animation: ao-breathe 3.6s ease-in-out infinite; }
    .ao-look { animation: ao-glance 9s ease-in-out infinite; }
    .ao-eyes { animation: ao-blink 4.8s ease-in-out infinite; }
    @keyframes ao-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes ao-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 0.985); } }
    @keyframes ao-glance { 0%, 30%, 100% { transform: translateX(0); } 38%, 52% { transform: translateX(-3px); } 60%, 74% { transform: translateX(3px); } 82% { transform: translateX(0); } }
    @keyframes ao-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .ao-float, .ao-body, .ao-eyes, .ao-look { animation: none; } }
  </style>
  <rect width="104" height="104" rx="30" fill="#2b2547"/>
  <g transform="translate(10 10) scale(0.84)"><g class="ao-float"><g class="ao-body" fill="#bbd1ff"><path d="M84.91 51.44C84.91 71.47 72.07 83.63 50.89 83.63C29.72 83.63 16.87 71.47 16.87 51.44C16.87 31.41 29.72 19.26 50.89 19.26C72.07 19.26 84.91 31.41 84.91 51.44Z"/></g><g class="ao-look"><g class="ao-eyes" fill="#0b0f18"><path d="M47.24 45.43C47.13 52.95 46.91 53.47 43.77 53.42C40.64 53.37 40.43 52.85 40.54 45.34C40.65 37.82 40.87 37.3 44.01 37.35C47.14 37.4 47.35 37.92 47.24 45.43Z"/><path d="M65.15 45.55C65.37 54.87 65.14 55.52 61.7 55.6C58.26 55.68 58 55.04 57.79 45.72C57.57 36.41 57.79 35.76 61.24 35.68C64.68 35.59 64.93 36.24 65.15 45.55Z"/></g></g></g></g>
</svg>
