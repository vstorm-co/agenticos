<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AgenticOS">
  <title>AgenticOS</title>
  <!-- One runner, several surfaces: a filled core with three orbits leaving it.
       The core is the agent's frozen version; the rings are the surfaces that
       reach it. Paths only, one accent, no gradients - it has to read at 16px in
       a browser tab and monochrome on a dark README. -->
  <g fill="none" stroke="#5a8cda" stroke-width="2.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="21.5" stroke-dasharray="34 9" />
    <circle cx="32" cy="32" r="14" stroke-dasharray="22 7" stroke-opacity="0.75" />
  </g>
  <circle cx="32" cy="32" r="6.5" fill="#5a8cda" />
  <g fill="#5a8cda">
    <circle cx="32" cy="10.5" r="3.6" />
    <circle cx="50.6" cy="42.8" r="3.6" />
    <circle cx="13.4" cy="42.8" r="3.6" />
  </g>
</svg>
