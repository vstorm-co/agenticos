<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -1 16 20" width="128" height="160" shape-rendering="crispEdges" role="img" aria-label="Amigo, the AgenticOS pet">
  <title>Amigo</title>
  <style>
    /* An idle, not an entrance: one pixel of bob and an occasional blink, so the
       character reads as alive in a README without asking for attention. Both are
       additive - with no CSS at all the first frame is the drawing itself. */
    .amigo { animation: amigo-bob 2.6s steps(1, end) infinite; }
    .amigo-eyelid { opacity: 0; animation: amigo-blink 4.9s steps(1, end) infinite; }
    @keyframes amigo-bob {
      0%, 49% { transform: translateY(0); }
      50%, 100% { transform: translateY(-1px); }
    }
    @keyframes amigo-blink {
      0%, 96% { opacity: 0; }
      97%, 99% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .amigo, .amigo-eyelid { animation: none; }
    }
  </style>
  <g class="amigo">
