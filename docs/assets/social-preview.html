<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgenticOS - social preview</title>
<!--
  The source of docs/assets/social-preview.gif and .png, kept because the card it
  replaced was a finished PNG with nothing behind it: the mark changed, the card
  kept showing the old one, and no check noticed.

  The screen is a real one, cut straight from docs/assets/screens/dark/ rather
  than redrawn, so the card cannot show a product this one is not. One screen and
  not three: a card people read in a second has time to say one thing.

  Open it in a browser and Amigo paces. Render it with:

    frames: load ?frame=N&of=48 for N in 0..47, screenshot 1280x640 at dpr 2
    downscale: each frame to 1280x640, Lanczos - which is where the legible text
      comes from; rendering straight at dpr 1 gives the screenshot no subpixels
      to average and the app reads as grey noise
    assemble: any GIF writer, 110ms a frame, one palette shared by every frame

  Type comes from Google Fonts rather than the repository's woff2 files, because
  this is rendered once by hand and a relative path out of docs/ into frontend/
  would not survive the docs build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F5F4EF;
    --dim: #656B76;
    --rule: #23262E;
    --travel: 156px;
    --scale: 6;
    --cycle: 5.28s;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #0B0C0F; }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #0B0C0F;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }

  .copy { position: absolute; left: 72px; top: 68px; width: 560px; }

  .meta {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin: 0 0 22px;
  }

  .wordmark {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800;
    font-size: 96px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    margin: 0;
  }

  .tagline {
    margin: 22px 0 0;
    font-size: 27px;
    line-height: 1.38;
    color: #A7ACB6;
  }
  .tagline b { color: var(--ink); font-weight: 600; }

  /* The window runs off the right edge on purpose. A card that fits a whole
     2906-pixel screen into half its width is showing a texture, not a product;
     cropping past the sidebar is what buys the scale back, and the headings are
     legible at the size that leaves. */
  .stage {
    position: absolute;
    left: 668px;
    top: 80px;
    width: 700px;
    height: 480px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: #101318;
    overflow: hidden;
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.6);
  }
  .chrome {
    height: 38px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    background: #14171D;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2C313A; }
  .route {
    margin-left: 12px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--dim);
  }

  .viewport { position: relative; height: calc(100% - 38px); overflow: hidden; }
  /* One offset, measured against the source: the sidebar is the least
     interesting 15% of the screen, and the run worth showing starts at the
     sentence before the chart the agent drew. */
  .shot { position: absolute; width: 1500px; left: -452px; top: -386px; }

  .ledge {
    position: absolute;
    left: 72px;
    bottom: 128px;
    width: 470px;
    height: 1px;
    background: var(--rule);
  }
  .repo {
    position: absolute;
    left: 72px;
    bottom: 68px;
    margin: 0;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 18px;
    color: var(--dim);
  }
  .repo b { color: #9AA0AB; font-weight: 400; }

  .walker {
    position: absolute;
    left: 72px;
    bottom: 130px;
    width: calc(16px * var(--scale));
    height: calc(20px * var(--scale));
    animation: pace var(--cycle) steps(24, end) infinite;
  }
  .walker svg { display: block; width: 100%; height: 100%; }
  .bubble {
    position: absolute;
    left: calc(16px * var(--scale) + 16px);
    bottom: calc(20px * var(--scale) - 20px);
    white-space: nowrap;
    background: var(--ink);
    color: #14161B;
    font-weight: 600;
    font-size: 18px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -5px; bottom: 11px;
    width: 10px; height: 10px;
    background: var(--ink);
    transform: rotate(45deg);
  }

  .step-b { opacity: 0; }
  .sprite { animation: bob 0.44s steps(1, end) infinite; }
  .step-a { animation: step-a 0.44s steps(1, end) infinite; }
  .step-b { animation: step-b 0.44s steps(1, end) infinite; }

  @keyframes pace {
    0% { transform: translateX(0); }
    50% { transform: translateX(var(--travel)); }
    100% { transform: translateX(0); }
  }
  @keyframes bob {
    0%, 49% { transform: translateY(0); }
    50%, 100% { transform: translateY(-6px); }
  }
  @keyframes step-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes step-b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }

  /* One frame, for the renderer: every animation off and the same values set
     directly, so a captured frame is exact rather than whatever the wall clock
     happened to be when the shutter went. */
  body.frozen * { animation: none !important; }
</style>
</head>
<body>
<div class="card">

    <p class="meta">Self-hosted &middot; Apache-2.0 &middot; Open source</p>
    <h1 class="wordmark">AgenticOS</h1>

      <g class="step-b" id="stepB"><rect x="4" y="17" width="3" height="2" fill="#4a2c17"/><rect x="9" y="17" width="3" height="2" fill="#4a2c17"/></g>
    </svg>
  </div>
  <p class="repo"><b>github.com</b>/vstorm-co/agenticos</p>
</div>
<script>
  // ?frame=N&of=M freezes the card on one exact frame of the loop.
  const q = new URLSearchParams(location.search);
  if (q.has("frame")) {
    const of = Number(q.get("of") || 48);
    const f = Number(q.get("frame")) % of;
    const half = of / 2;
    const t = f < half ? f / half : (of - f) / half;    // 0 -> 1 -> 0
    const travel = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--travel"));
    const step = Math.floor(f / 2) % 2 === 0;           // one pose every two frames
    document.body.classList.add("frozen");
    document.getElementById("walker").style.transform = `translateX(${Math.round(t * travel)}px)`;
    document.getElementById("sprite").style.transform = step ? "translateY(0)" : "translateY(-6px)";
    document.getElementById("stepA").style.opacity = step ? "1" : "0";
    document.getElementById("stepB").style.opacity = step ? "0" : "1";
  }
</script>

</html>
