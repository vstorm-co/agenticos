<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgenticOS - social preview</title>
<!--
  The source of docs/assets/social-preview.png, kept because a card that is only a
  finished PNG goes stale the day the mark changes and no check notices.

  The mark is docs/assets/logo.svg itself, loaded rather than copied, and the
  agents around it are drawn by the same blobatar version the console's avatars
  use, on the console's own hues - so the card shows the product's faces, not a
  drawing of them. Render it with:

    screenshot the .card at 1280x640, dpr 2
    downscale to 1280x640, Lanczos (magick in.png -filter Lanczos -resize 1280x640 out.png)

  Type and the library come from public CDNs rather than the repository, because
  this is rendered once by hand and a relative path out of docs/ into frontend/
  would not survive the docs build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #100e18;
    --tile: #2b2547;
    --ink: #f4f2fb;
    --dim: #a19cb8;
    --blob: #bbd1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background:
      radial-gradient(circle at 76% 50%, rgba(129, 112, 214, 0.22), transparent 46%),
      radial-gradient(circle at 76% 50%, rgba(43, 37, 71, 0.55), transparent 72%),
      var(--ground);
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }

  /* The console's dotted canvas, faint, so the ground reads as a workspace. */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 45%, #000 100%);
  }

  .copy {
    position: absolute;
    left: 80px;
    top: 0;
    bottom: 0;
    width: 600px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .meta {
    margin: 0;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  h1 {
    margin: 22px 0 0;
    font-size: 104px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.95;
  }
  .tag {
    margin: 26px 0 0;
    font-size: 28px;
    line-height: 1.38;
    color: #c9c5da;
    text-wrap: balance;
  }
  .tag b { color: var(--blob); font-weight: 600; }

  .repo {
    position: absolute;
    left: 80px;
    bottom: 56px;
    margin: 0;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 17px;
    color: var(--dim);
  }
  .repo b { color: var(--ink); font-weight: 400; }

  .crew { position: absolute; inset: 0; }
  .crew > * { position: absolute; }
  .mark {
    left: 828px;
    top: 170px;
    width: 300px;
    height: 300px;
    /* The tile's own corner (30 of 104), so the rim follows it exactly. */
    border-radius: 86.5px;
    box-shadow: 0 0 0 1.5px rgba(187, 209, 255, 0.16), 0 30px 64px rgba(4, 3, 10, 0.65);
  }
  .agent {
    width: var(--s);
    height: var(--s);
    filter: drop-shadow(0 10px 22px rgba(8, 6, 16, 0.5));
  }
  .agent svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="copy">
    <p class="meta">Self-hosted &middot; Apache-2.0 &middot; Open source</p>
    <h1>AgenticOS</h1>
    <p class="tag">One place to <b>build</b>, <b>run</b> and <b>govern</b> your company&rsquo;s AI agents.</p>
  </div>

  <div class="crew" id="crew">
    <img class="mark" src="logo.svg" alt="AgenticOS">
  </div>

  <p class="repo"><b>github.com</b>/vstorm-co/agenticos</p>
</div>

<script type="module">
  import { blobatar } from "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/+esm";

  // A company's agents around the one that runs them: names a real team would
  // give them, each on a hue from the console's AVATAR_HUES.
  const AGENTS = [
    { seed: "support", hue: 175, x: 742, y: 92, s: 92 },
    { seed: "research", hue: 20, x: 1150, y: 110, s: 80 },
    { seed: "finance", hue: 140, x: 1170, y: 392, s: 70 },
    { seed: "legal", hue: 300, x: 1060, y: 500, s: 64 },
    { seed: "ops", hue: 55, x: 712, y: 430, s: 76 },
    { seed: "sales", hue: 330, x: 980, y: 66, s: 58 },
  ];
  const crew = document.getElementById("crew");
  for (const agent of AGENTS) {
    const el = document.createElement("div");
    el.className = "agent";
    el.style.cssText = `left:${agent.x}px;top:${agent.y}px;--s:${agent.s}px`;
    el.innerHTML = blobatar(agent.seed, { hue: agent.hue, background: "circle" });
    crew.append(el);
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
