<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgenticOS - social preview</title>
<!--
  The source of docs/assets/social-preview.gif and .png, kept because the card it
  replaced was a finished PNG with nothing behind it: the mark changed, the card
  kept showing the old one, and no check noticed.

  Three real screens, one per verb in the tagline - the builder for "build", a
  chat run for "run", the spend ledger for "govern" - cut straight from
  docs/assets/screens/dark/ rather than redrawn, so the card cannot show a
  product this one is not. The verb lights up with the screen under it.

  Open it in a browser and it runs. Render it with:

    frames: load ?frame=N&of=48 for N in 0..47, screenshot 1280x640 at dpr 1
    assemble: any GIF writer, 110ms a frame, one shared palette

  Type comes from Google Fonts rather than the repository's woff2 files, because
  this is rendered once by hand and a relative path out of docs/ into frontend/
  would not survive the docs build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F5F4EF;
    --muted: #8A909B;
    --dim: #656B76;
    --rule: #23262E;
    --accent: #F2C14E;
    --travel: 156px;
    --scale: 6;
    --cycle: 5.28s;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #0B0C0F; }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #0B0C0F;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }

  .copy { position: absolute; left: 72px; top: 68px; width: 560px; }

  .meta {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin: 0 0 22px;
  }

  .wordmark {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800;
    font-size: 96px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    margin: 0;
  }

  .tagline {
    margin: 22px 0 0;
    font-size: 27px;
    line-height: 1.38;
    color: #A7ACB6;
  }
  /* The verb lights with the screen beside it, so the card says which third of
     the sentence the picture is evidence for. */
  .tagline b { color: var(--ink); font-weight: 600; transition: none; }
  .v1 { animation: lit-1 var(--cycle) steps(1, end) infinite; }
  .v2 { animation: lit-2 var(--cycle) steps(1, end) infinite; }
  .v3 { animation: lit-3 var(--cycle) steps(1, end) infinite; }

  /* The window. It runs off the right edge on purpose: a card that fits the
     whole screen into a third of its width is showing a texture, not a product,
     and cropping is what buys the scale back. */
  .stage {
    position: absolute;
    left: 672px;
    top: 84px;
    width: 720px;
    height: 472px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: #101318;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
  }
  .chrome {
    height: 38px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    background: #14171D;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2C313A; }
  .route {
    margin-left: 12px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--dim);
    position: relative;
  }
  .route span { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }
  .route span:first-child { opacity: 1; }

  .viewport { position: relative; height: calc(100% - 38px); overflow: hidden; }
  .shot {
    position: absolute;
    width: 1520px;
    image-rendering: auto;
    opacity: 0;
  }
  .shot:first-of-type { opacity: 1; }
  /* One offset per screen: the sidebar is the least interesting 15% of every
     one of them, so each is pulled left past it and down to its content. */
  .s1 { left: -246px; top: -26px; }
  .s2 { left: -465px; top: -372px; }
  .s3 { left: -246px; top: -23px; }

  .s1, .r1 { animation: show-1 var(--cycle) steps(1, end) infinite; }
  .s2, .r2 { animation: show-2 var(--cycle) steps(1, end) infinite; }
  .s3, .r3 { animation: show-3 var(--cycle) steps(1, end) infinite; }

  @keyframes show-1 { 0%, 32.9% { opacity: 1; } 33%, 100% { opacity: 0; } }
  @keyframes show-2 { 0%, 32.9% { opacity: 0; } 33%, 66.5% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
  @keyframes show-3 { 0%, 66.5% { opacity: 0; } 66.6%, 100% { opacity: 1; } }
  @keyframes lit-1 { 0%, 32.9% { color: var(--accent); } 33%, 100% { color: var(--ink); } }
  @keyframes lit-2 { 0%, 32.9% { color: var(--ink); } 33%, 66.5% { color: var(--accent); } 66.6%, 100% { color: var(--ink); } }
  @keyframes lit-3 { 0%, 66.5% { color: var(--ink); } 66.6%, 100% { color: var(--accent); } }

  /* The ledge Amigo walks on, and the line the repository sits under. */
  .ledge {
    position: absolute;
    left: 72px;
    bottom: 128px;
    width: 470px;
    height: 1px;
    background: var(--rule);
  }
  .repo {
    position: absolute;
    left: 72px;
    bottom: 68px;
    margin: 0;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 18px;
    color: var(--dim);
  }
  .repo b { color: #9AA0AB; font-weight: 400; }

  .walker {
    position: absolute;
    left: 72px;
    bottom: 130px;
    width: calc(16px * var(--scale));
    height: calc(20px * var(--scale));
    animation: pace var(--cycle) steps(24, end) infinite;
  }
  .walker svg { display: block; width: 100%; height: 100%; }
  .bubble {
    position: absolute;
    left: calc(16px * var(--scale) + 16px);
    bottom: calc(20px * var(--scale) - 20px);
    white-space: nowrap;
    background: var(--ink);
    color: #14161B;
    font-weight: 600;
    font-size: 18px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -5px; bottom: 11px;
    width: 10px; height: 10px;
    background: var(--ink);
    transform: rotate(45deg);
  }

  .step-b { opacity: 0; }
  .sprite { animation: bob 0.44s steps(1, end) infinite; }
  .step-a { animation: step-a 0.44s steps(1, end) infinite; }
  .step-b { animation: step-b 0.44s steps(1, end) infinite; }

  @keyframes pace {
    0% { transform: translateX(0); }
    50% { transform: translateX(var(--travel)); }
    100% { transform: translateX(0); }
  }
  @keyframes bob {
    0%, 49% { transform: translateY(0); }
    50%, 100% { transform: translateY(-6px); }
  }
  @keyframes step-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes step-b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }

  /* One frame, for the renderer: every animation off and the same values set
     directly, so a captured frame is exact rather than whatever the wall clock
     happened to be when the shutter went. */
  body.frozen * { animation: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <p class="meta">Self-hosted &middot; Apache-2.0 &middot; Open source</p>
    <h1 class="wordmark">AgenticOS</h1>

    </div>
    <div class="viewport">

      <img class="shot s3" src="screens/dark/activity-spend.webp" alt="">

      <g class="step-a" id="stepA"><rect x="3" y="17" width="3" height="2" fill="#4a2c17"/><rect x="10" y="17" width="3" height="2" fill="#4a2c17"/></g>
      <g class="step-b" id="stepB"><rect x="4" y="17" width="3" height="2" fill="#4a2c17"/><rect x="9" y="17" width="3" height="2" fill="#4a2c17"/></g>
    </svg>
  </div>
  <p class="repo"><b>github.com</b>/vstorm-co/agenticos</p>
</div>
<script>
  // ?frame=N&of=M freezes the card on one exact frame of the loop.
  const q = new URLSearchParams(location.search);
  if (q.has("frame")) {
    const of = Number(q.get("of") || 48);
    const f = Number(q.get("frame")) % of;
    const half = of / 2;
    const t = f < half ? f / half : (of - f) / half;    // 0 -> 1 -> 0
    const travel = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--travel"));
    const step = Math.floor(f / 2) % 2 === 0;           // one pose every two frames
    const scene = Math.min(2, Math.floor((f / of) * 3)); // three screens, hard cut
    document.body.classList.add("frozen");
    document.getElementById("walker").style.transform = `translateX(${Math.round(t * travel)}px)`;
    document.getElementById("sprite").style.transform = step ? "translateY(0)" : "translateY(-6px)";
    document.getElementById("stepA").style.opacity = step ? "1" : "0";
    document.getElementById("stepB").style.opacity = step ? "0" : "1";
    document.querySelectorAll(".shot").forEach((el, i) => (el.style.opacity = i === scene ? "1" : "0"));
    document.querySelectorAll(".route span").forEach((el, i) => (el.style.opacity = i === scene ? "1" : "0"));
    document.querySelectorAll(".tagline b").forEach((el, i) => {
      el.style.color = i === scene ? "var(--accent)" : "var(--ink)";
    });
  }
</script>
</body>
</html>
