<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgenticOS - social preview</title>
<!--
  The source of docs/assets/social-preview.gif and .png, kept because the card it
  replaced was a finished PNG with nothing behind it: the mark changed, the card
  kept showing the old one, and no check noticed.

  Open it in a browser and Amigo paces. Render it with:

    frames: load ?frame=N&of=48 for N in 0..47, screenshot 1280x640 at dpr 1
    assemble: any GIF writer, 110ms a frame, one shared palette

  Type comes from Google Fonts rather than the repository's woff2 files, because
  this is rendered once by hand and a relative path out of docs/ into frontend/
  would not survive the docs build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F5F4EF;
    --muted: #8A909B;
    --dim: #666C77;
    --ground: #121519;
    --rule: #23262E;
    --accent: #F2C14E;
    --travel: 268px;
    --scale: 8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #0B0C0F; }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #0B0C0F;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }

  .copy { position: absolute; left: 76px; top: 84px; right: 76px; }

  .meta {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 17px;
    letter-spacing: 0.16em;
    color: var(--dim);
    text-transform: uppercase;
    margin: 0 0 28px;
  }

  .wordmark {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800;
    font-size: 122px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    margin: 0;
  }

  .tagline {
    margin: 26px 0 0;
    font-size: 33px;
    line-height: 1.34;
    color: #AFB4BE;
    max-width: 820px;
  }
  .tagline b { color: var(--ink); font-weight: 600; }

  /* The ledge. Amigo needs something to walk on, and one flat band reads as
     ground without a drawn horizon or a gradient pretending to be depth. */
  .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 200px;
    background: var(--ground);
    border-top: 1px solid var(--rule);
  }
  .repo {
    position: absolute;
    right: 76px;
    bottom: 84px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 21px;
    color: var(--dim);
  }
  .repo b { color: #9AA0AB; font-weight: 400; }

  .walker {
    position: absolute;
    left: 76px;
    /* Standing on the ledge rather than inside it: at this size his head clears
       the band's top edge, which is what reads as standing on something. */
    bottom: 34px;
    width: calc(16px * var(--scale));
    height: calc(20px * var(--scale));
    animation: pace 5.28s steps(24, end) infinite;
  }
  .walker svg { display: block; width: 100%; height: 100%; }
  .bubble {
    position: absolute;
    left: calc(16px * var(--scale) + 18px);
    bottom: calc(20px * var(--scale) - 24px);
    white-space: nowrap;
    background: var(--ink);
    color: #14161B;
    font-weight: 600;
    font-size: 23px;
    padding: 11px 18px;
    border-radius: 12px;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -6px; bottom: 13px;
    width: 12px; height: 12px;
    background: var(--ink);
    transform: rotate(45deg);
  }

  .step-b { opacity: 0; }
  .sprite { animation: bob 0.44s steps(1, end) infinite; }
  .step-a { animation: step-a 0.44s steps(1, end) infinite; }
  .step-b { animation: step-b 0.44s steps(1, end) infinite; }

  @keyframes pace {
    0% { transform: translateX(0); }
    50% { transform: translateX(var(--travel)); }
    100% { transform: translateX(0); }
  }
  @keyframes bob {
    0%, 49% { transform: translateY(0); }
    50%, 100% { transform: translateY(-8px); }
  }
  @keyframes step-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes step-b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }

  /* A single frame, for the renderer. Every animation is switched off and the
     same values are set directly, so a captured frame is exact rather than
     whatever the wall clock happened to be. */
  body.frozen .walker,
  body.frozen .sprite,
  body.frozen .step-a,
  body.frozen .step-b { animation: none; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <p class="meta">Self-hosted &middot; Apache-2.0 &middot; Web app, desktop optional</p>
    <h1 class="wordmark">AgenticOS</h1>
    <p class="tagline">One place to <b>build</b>, <b>run</b> and <b>govern</b> your company&rsquo;s AI agents.</p>

  <p class="repo"><b>github.com</b>/vstorm-co/agenticos</p>

      <g class="step-a" id="stepA"><rect x="3" y="17" width="3" height="2" fill="#4a2c17"/><rect x="10" y="17" width="3" height="2" fill="#4a2c17"/></g>
      <g class="step-b" id="stepB"><rect x="4" y="17" width="3" height="2" fill="#4a2c17"/><rect x="9" y="17" width="3" height="2" fill="#4a2c17"/></g>
    </svg>
  </div>
</div>
<script>
  // ?frame=N&of=M freezes the card on one exact frame of the loop.
  const q = new URLSearchParams(location.search);
  if (q.has("frame")) {
    const of = Number(q.get("of") || 48);
    const f = Number(q.get("frame")) % of;
    const half = of / 2;
    const t = f < half ? f / half : (of - f) / half;   // 0 -> 1 -> 0
    const travel = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--travel"));
    const step = Math.floor(f / 2) % 2 === 0;           // one pose every two frames
    document.body.classList.add("frozen");
    document.getElementById("walker").style.transform = `translateX(${Math.round(t * travel)}px)`;
    document.getElementById("sprite").style.transform = step ? "translateY(0)" : "translateY(-8px)";
    document.getElementById("stepA").style.opacity = step ? "1" : "0";
    document.getElementById("stepB").style.opacity = step ? "0" : "1";
  }
</script>
