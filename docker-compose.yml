# Local development, on a laptop. `make dev`.
#
#   docker compose up -d
#
# Source is bind-mounted and uvicorn reloads, so an edit is live without a
# rebuild. Postgres and Redis publish their ports so psql, a GUI client and the
# test suite can reach them from the host.
#
# The three files, and which is which:
#
#   docker-compose.yml        this one - local
#   docker-compose-dev.yml    the dev server (built images, no bind mounts)
#   docker-compose-prod.yml   production
#
# The frontend is separate in all three: docker-compose[-env].frontend.yml.
#
# There used to be a fourth, `docker-compose.dev.yml`, whose header claimed it
# was identical to this file. It was not: it had drifted and lost
# `--ws websockets-sansio`, and it was the file `make dev` used - so the chat
# websocket 500'd on handshake for anyone developing locally.

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agenticos_backend:dev
    container_name: agenticos_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro
      - media_data:/app/media
      # email/templates.py reads pre-compiled HTML/text from /app/emails/compiled.
      # Build context is ./backend so the dir isn't in the image — mount it.
      - ./emails:/app/emails:ro
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty outside compose, so a bare `uvicorn` run degrades to "no container
      # workspace available" rather than erroring. Note what is absent here:
      # no docker.sock, which is the whole point of the service below.
      - SANDBOXD_URL=${SANDBOXD_URL-http://sandboxd:8080}
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which is broken with websockets >=14 (handshake → HTTP 500). The sansio
    # implementation is the modern, compatible one. Required for the chat WS.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws websockets-sansio
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    # pgvector, not stock postgres: the RAG store runs
    # `CREATE EXTENSION IF NOT EXISTS vector` when a collection is first
    # written to, and on postgres:16-alpine that fails with
    # `extension "vector" is not available` — so every document upload 500s
    # before a row is committed. Same major version, same data directory.
    image: pgvector/pgvector:pg16
    container_name: agenticos_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agenticos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port exposed only for local development - remove in production
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agenticos_redis
    # Port exposed only for local development - remove in production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: agenticos_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.local/share/prefect/
    environment:
      - PREFECT_UI_URL=http://localhost:4200/api
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prefect-runner:
    image: agenticos_backend:dev
    pull_policy: never
    container_name: agenticos_prefect_runner
    volumes:
      - ./backend/app:/app/app:ro
      - media_data:/app/media
    command: python -m app.worker.prefect_app
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - POSTGRES_HOST=db
      - PREFECT_API_URL=http://prefect-server:4200/api
    networks:
      - backend
    depends_on:
      prefect-server:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # The only service that holds the Docker socket, and the reason an agent can
  # be given a container without this application ever having Docker access.
  # Behind a profile so a host that will not have the socket mounted turns it
  # off by editing one variable rather than deleting a service.
  #
  # The socket is an unauthenticated API for root on the host. Read-only does
  # not help: the API alone is enough. So the service is never published, and
  # its token is worth exactly as much as the socket is.
  sandboxd:
    image: ghcr.io/vstorm-co/sandboxd:0.2
    container_name: agenticos_sandboxd
    profiles: [sandbox]
    environment:
      SANDBOXD_TOKEN: ${SANDBOXD_TOKEN:?run `make sandbox-token` to generate one}
      SANDBOXD_HOST: 0.0.0.0
      SANDBOXD_PORT: "8080"
      # Files survive an idle reaping; without it a conversation's workspace
      # silently empties between turns and the agent references a file that is
      # gone.
      SANDBOXD_WORKSPACE_ROOT: /workspaces
      SANDBOXD_PERSIST_CONTAINERS: "true"
      # One organization cannot occupy the pool of the whole installation.
      SANDBOXD_MAX_SESSIONS_PER_TENANT: "5"
      SANDBOXD_NETWORK_MODE: none
      # Its own dashboard asks a human to paste a root-equivalent token into a
      # browser. AgenticOS proxies the same data behind its own authorization.
      SANDBOXD_UI_ENABLED: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_workspaces:/workspaces
    # Reaches the daemon by supplementary group rather than by running as root.
    # `stat -c '%g' /var/run/docker.sock` on the host; 0 on Docker Desktop,
    # where the socket is proxied and already reachable.
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    # Named explicitly so the frontend compose file can join it as an external
    # network instead of guessing the project-prefixed default.
    name: agenticos_backend
    driver: bridge

volumes:
  media_data:
  sandbox_workspaces:
  postgres_data:
  redis_data:
  prefect_data:
