# The product, from the published images. `docker compose up -d`.
#
# On its own - downloaded into an empty directory, no clone - this file pulls
# `ghcr.io/vstorm-co/agenticos-backend` and `agenticos-frontend`, starts
# Postgres (pgvector), Redis, the Prefect server and runner, the API and the
# console, runs the migrations, and answers on http://localhost:3000. Every
# variable carries a default, so there is no `.env` to write first; write one
# beside this file when there is something to change - `AGENTICOS_VERSION` to
# pin a release, `PUBLIC_*` when the browser reaches the host by a name other
# than `localhost`, a provider key. `docs/install.md` has the list.
#
# In a clone, Compose merges `docker-compose.override.yml` over this file on its
# own, and that override is what turns it into the local development stack:
# source built into the image, bind-mounted and reloading, the database and
# Redis published to the host. `make dev` is that pair of files; so is a bare
# `docker compose up` in a checkout. The other two environments have files of
# their own:
#
#   docker-compose.yml           this one - the product, from images
#   docker-compose.override.yml  merged in a clone - built from source, reloading
#   docker-compose-dev.yml       the dev server (published images, no bind mounts)
#   docker-compose-prod.yml      production
#
# The frontend used to be a separate file in every environment. It is a service
# here now, because the console is part of the product and a `docker compose up`
# that leaves it out answers on a port nobody was told about. Locally it sits
# behind the `console` profile (the override puts it there), so that `bun dev`
# on the host is not fighting a container for :3000.
#
# The application containers read two env files, both optional: `.env` beside
# this file - where a standalone install keeps its settings, and the same file
# Compose reads for `${...}` - and `backend/.env`, which is where a clone keeps
# them and where the rest of this repository says to look.

services:
  # Runs the migrations and exits. `app` and `prefect-runner` wait for it to have
  # *completed*, not for the database to be up, so a first `up` on an empty
  # volume is one command and a second `up` on a migrated one is a no-op that
  # takes a second. `docker compose logs migrate` is where a failed migration
  # says why the API never started.
  migrate:
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-latest}
    container_name: agenticos_migrate
    command: agenticos db upgrade
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-latest}
    container_name: agenticos_backend
    # Longer than background.drain()'s 30s timeout, or Docker's 10s default
    # SIGKILLs the container mid-drain and an upload stays `processing` (#11).
    stop_grace_period: 40s
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty outside compose, so a bare `uvicorn` run degrades to "no container
      # workspace available" rather than erroring. Note what is absent here:
      # no docker.sock, which is the whole point of the sandbox service below.
    # One worker by default. `--workers` above 1 puts uvicorn's supervisor at
    # PID 1, which replaces a worker that dies; at 1 the process *is* PID 1, so
    # a death is a container exit and `restart:` below is what replaces it. A
    # worker that is wedged rather than dead kills itself either way
    # (`app/core/watchdog.py`). Each worker imports the application on its own,
    # 460 MiB measured, so raise this with the host's memory in mind -
    # docker-compose-prod.yml sizes four.
    #
    # `--ws websockets-sansio`: uvicorn's `auto` picks the legacy websockets
    # implementation, which fails the handshake against websockets >=14, and the
    # chat is a WebSocket.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-1} --ws websockets-sansio
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # This probe used to be a HEALTHCHECK in backend/Dockerfile, which the Prefect
    # runner inherited along with the image and could never answer. It lives with
    # the service that serves it now; see prefect-runner for the other half.
    # Two things are not carried over verbatim. `raise_for_status`: `httpx.get` on
    # its own returns a response object whatever the status, so the old probe
    # passed on a 500 as happily as on a 200. And `start_period`, which was 5s -
    # shorter than this application takes to import on any machine measured, so
    # every start went through a spell of `unhealthy` before settling.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    # pgvector, not stock postgres: the RAG store runs
    # `CREATE EXTENSION IF NOT EXISTS vector` when a collection is first
    # written to, and on postgres:16-alpine that fails with
    # `extension "vector" is not available` — so every document upload 500s
    # before a row is committed. Same major version, same data directory.
    image: pgvector/pgvector:pg16
    container_name: agenticos_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agenticos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agenticos_redis
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: agenticos_prefect_server
    command: prefect server start --host 0.0.0.0
    volumes:
      - prefect_data:/root/.local/share/prefect/
    environment:
      - PREFECT_UI_URL=http://localhost:4200/api
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prefect-runner:
    image: ghcr.io/vstorm-co/agenticos-backend:${AGENTICOS_VERSION:-latest}
    container_name: agenticos_prefect_runner
    volumes:
      - media_data:/app/media
    command: python -m app.worker.prefect_app
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - POSTGRES_HOST=db
      - PREFECT_API_URL=http://prefect-server:4200/api
      # The runner's own health endpoint, started by app/worker/prefect_app.py.
      # 127.0.0.1 rather than 0.0.0.0 because the same webserver also serves
      # `/shutdown`, and the only caller that should reach it is the probe below,
      # inside this container. Pinned here rather than left to Prefect's defaults
      # so a value in an env file cannot move the port out from under the probe.
      - PREFECT_RUNNER_SERVER_HOST=127.0.0.1
      - PREFECT_RUNNER_SERVER_PORT=8080
    networks:
      - backend
    depends_on:
      prefect-server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Answers 503 once the runner has missed two polls, so a process that is alive
    # but no longer polling reads as unhealthy - which is the failure this status
    # exists to show. The long start_period covers importing the whole application
    # and registering the deployments: until the first poll `/health` has no
    # `last_polled` to compare against and errors.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8080/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # The console. `BACKEND_URL` is the server-side address its route handlers
  # proxy to; the `PUBLIC_*` values are what it tells the *browser* to call, and
  # they are read when the container starts rather than baked into the image
  # (#1544) - so the same image serves localhost and a host with a name, and a
  # change is a restart. They stay `localhost` until the site is reached by
  # another name; then set them beside `FRONTEND_URL` and `CORS_ORIGINS`, which
  # are the backend's side of the same fact.
  frontend:
    image: ghcr.io/vstorm-co/agenticos-frontend:${AGENTICOS_VERSION:-latest}
    container_name: agenticos_frontend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://app:8000
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost:8000}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:3000}
      # The composer refuses a file above this before uploading it; the backend's
      # `CHAT_MAX_UPLOAD_SIZE_MB` is the limit it would hit otherwise, so the two
      # are the same name and should be given the same value.
      - CHAT_MAX_UPLOAD_SIZE_MB=${CHAT_MAX_UPLOAD_SIZE_MB:-10}
      - OAUTH_PROVIDERS=${OAUTH_PROVIDERS:-google}
      # `instrumentation.ts` registers an OpenTelemetry SDK on every boot, and
      # `@vercel/otel` off Vercel takes its exporter from these two - so without
      # them the frontend's server-side spans are built and dropped in-process.
      # Passed through empty by default rather than omitted: an operator who
      # points them at Logfire (the same project the backend writes to) then gets
      # traces without editing a compose file. `frontend/README.md` has the pair.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The oven/bun image has no curl/wget, so probe with bun's built-in fetch.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # The only service that holds the Docker socket, and the reason an agent can
  # be given a container without this application ever having Docker access.
  # Behind a profile so a host that will not have the socket mounted turns it
  # off by editing one variable rather than deleting a service.
  #
  # The socket is an unauthenticated API for root on the host. Read-only does
  # not help: the API alone is enough. So the service is never published, and
  # its token is worth exactly as much as the socket is.
  sandboxd:
    image: ghcr.io/vstorm-co/sandboxd:0.2
    container_name: agenticos_sandboxd
    profiles: [sandbox]
    # The token comes from the same files every other secret in this stack comes
    # from, rather than through compose interpolation: interpolation reads the
    # project root's `.env` only, so a token generated into `backend/.env` -
    # where `make sandbox-token` puts it - would have been invisible here. Every
    # other variable in this file carries a default precisely so the stack
    # starts with no env file at all. The service exits naming the variable when
    # it is missing, which `docker compose logs sandboxd` shows.
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      SANDBOXD_HOST: 0.0.0.0
      SANDBOXD_PORT: "8080"
      # One host path, mounted at the same location on both sides, which is the
      # only arrangement that works: this service creates the directory and then
      # asks the *daemon* to bind-mount it, and the daemon resolves the path on
      # the host. A named volume, or any path existing only inside this
      # container, is refused with "mounts denied: the path is not shared from
      # the host".
      #
      # Without it the service keeps nothing on disk, and then a workspace can
      # only be read by starting a container - which browsing deliberately never
      # does, so the Files panel could show a conversation's files only as
      # "this host's files could not be read". `persist_containers` did keep them
      # alive; it did not make them readable.
      #
      # `/tmp` rather than the `/var/lib` of the server files: it is shared by
      # Docker Desktop by default, so this works on a laptop with no host setup,
      # and it is world-writable, so the service's uid 10001 needs no `install
      # -d -o`. The cost is that a reboot sweeps it - fine for local dev, wrong
      # for a host somebody's work lives on. See docker-compose-prod.yml.
      SANDBOXD_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}
      # Which environments an agent may ask for. **Generated - do not edit here.**
      # `make sandbox-runtimes` writes it from
      # backend/app/core/catalog/sandbox_runtimes.json, which is where a runtime
      # is added or a package changed, and which the connection dialog offers as
      # well - so the two cannot disagree about what this deployment ships.
      # `backend/tests/test_sandbox_runtime_catalog.py` fails when this line has
      # drifted from that file.
      #
      # Written into a tracked file rather than read from one at start-up because
      # `docker compose up` has to work without generating anything first;
      # otherwise a deployment silently gets the library's own default allowlist.
      #
      # Not a form in the product, and that is upstream's decision rather than an
      # omission: `PUT /policy` changes ceilings and lifetimes at run time and
      # deliberately refuses `runtimes` membership, because naming an image is a
      # decision about isolation and this token belongs to an application rather
      # than to whoever runs the host. Changing the list is a restart, and
      # `prewarm` rebuilds what it names as the service starts rather than inside
      # somebody's first request - which is minutes on a cold cache, and the
      # reason this deployment ships one runtime rather than eight.
      SANDBOXD_RUNTIMES: '{"workbench":{"description":"Python, Node and LibreOffice - documents, data, charts and code","runtime":{"name":"workbench","base_image":"python:3.12-slim","description":"Python, Node and LibreOffice - documents, data, charts and code","setup_commands":["apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates ripgrep fd-find jq less procps xz-utils poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress unzip zip tzdata fonts-dejavu-core && ln -s /usr/bin/fdfind /usr/local/bin/fd && rm -rf /var/lib/apt/lists/*","arch=\"$$(dpkg --print-architecture)\"; case \"$$arch\" in amd64) node_arch=x64 ;; arm64) node_arch=arm64 ;; *) echo \"no Node build for $$arch\" >&2; exit 1 ;; esac; curl -fsSL \"https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-$${node_arch}.tar.xz\" | tar -xJ -C /usr/local --strip-components=1 --exclude CHANGELOG.md --exclude README.md --exclude LICENSE && npm install -g tsx && npm cache clean --force","curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh"],"packages":["liteparse","pypdf","python-docx","openpyxl","python-pptx","pillow","pandas","duckdb","matplotlib","httpx","requests","beautifulsoup4","lxml","markdownify","pyyaml","tabulate","reportlab"],"env_vars":{"PYTHONUNBUFFERED":"1","PYTHONDONTWRITEBYTECODE":"1","PYTHONUTF8":"1","MPLBACKEND":"Agg","PIP_DISABLE_PIP_VERSION_CHECK":"1"}},"mem_limit":"2g","network_mode":"bridge"}}'
      # An escape starts from whoever the container runs as, and the default is
      # root. The image is built around this uid - a home directory and a
      # virtualenv it owns, without which an agent's `pip install` fails - so it
      # only applies to a runtime this deployment builds, which `workbench` is.
      # It also makes every file an agent writes owned by this uid on the host,
      # rather than by root.
      #
      # **The service's own uid, and it has to be.** Opening a session `chown`s
      # the workspace to this user, and a sandboxd running unprivileged can only
      # do that for itself - so a different number here fails at the first
      # session rather than at start-up.
      SANDBOXD_SANDBOX_UID: "10001"
      SANDBOXD_PERSIST_CONTAINERS: "true"
      # What a session installed inside its container - the build, the wheels,
      # `node_modules` - reclaimed a day after it stopped. Without it a persisted
      # container is kept for ever and the host fills up with the ones nobody
      # reattached to. The workspace is untouched: the files are the work, the
      # container is rebuildable.
      SANDBOXD_CONTAINER_TTL: "86400"
      # One organization cannot occupy the pool of the whole installation
      # (`SANDBOXD_MAX_SESSIONS`, 20). Ten rather than five because a session is
      # per conversation by default: five was two people with three chats open,
      # and the sixth was refused with "already holds 5 of 5".
      SANDBOXD_MAX_SESSIONS_PER_TENANT: "10"
      SANDBOXD_NETWORK_MODE: none
      # Its own dashboard asks a human to paste a root-equivalent token into a
      # browser. AgenticOS proxies the same data behind its own authorization.
      SANDBOXD_UI_ENABLED: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}:${SANDBOX_WORKSPACE_ROOT:-/tmp/agenticos-sandbox-workspaces}
    # Reaches the daemon by supplementary group rather than by running as root.
    # `stat -c '%g' /var/run/docker.sock` on the host; 0 on Docker Desktop,
    # where the socket is proxied and already reachable.
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    # Named explicitly so a file run as a project of its own - the dev server's
    # frontend - can join it as an external network instead of guessing the
    # project-prefixed default.
    name: agenticos_backend
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  prefect_data:
