# Production. `make prod`.
#
#   docker compose --env-file backend/.env -f docker-compose-prod.yml up -d --build
#
# Prerequisites:
#   1. `backend/.env` with real secrets. The same file serves every environment;
#      there is no `.env.prod`. Work through the production checklist in
#      `docs/configuration.md` first — VAULT_MASTER_KEY especially.
#   2. A reverse proxy in front of this stack. `nginx/nginx.conf` is the
#      template; it proxies to `backend:8000` and `frontend:3000`, and both
#      names are provided as network aliases below.
#
# The frontend is `docker-compose-prod.frontend.yml`.
#
# Two networks, deliberately:
#
#   `data`  — internal, no route off the host. Postgres and Redis live here and
#             have no business reaching the internet.
#   `edge`  — an ordinary bridge. The app needs it: every agent run calls a
#             model provider, and an MCP connection calls a vendor's server.
#
# This used to be one network marked `internal: true`, which blocks egress. The
# database was correctly unreachable and so was api.anthropic.com, so no agent
# could have answered anything.

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agenticos_backend:prod
    container_name: agenticos_backend
    volumes:
      - media_data:/app/media
      # email/templates.py reads pre-compiled HTML/text from /app/emails/compiled.
      # Build context is ./backend so the dir isn't in the image — mount it.
      - ./emails:/app/emails:ro
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which fails the handshake against websockets >=14. The chat WS needs it in
    # production exactly as much as it does locally.
    #
    # --workers puts uvicorn's own `Multiprocess` supervisor at PID 1, and it is
    # deliberately left there (#358): it pings each worker and replaces one that
    # does not answer within `timeout_worker_healthcheck`, which covers a worker
    # that died, hung or was stopped. What it cannot cover is a worker whose
    # event loop is blocked, because the ping is answered by a thread
    # (`Process.always_pong`) that keeps answering regardless - so the one
    # stack with cover had cover against the least likely failure. The worker
    # now judges its own loop (`app/core/watchdog.py`) and kills itself, which
    # this supervisor already replaces twice a second. Subclassing it instead
    # would have meant owning four upstream call sites in the one process whose
    # job is to survive whatever killed the worker.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 4 --ws websockets-sansio
    networks:
      data:
      edge:
        aliases:
          - backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Moved out of backend/Dockerfile, which the Prefect runner shares and could
    # never answer; see docker-compose.yml for the whole reasoning, including why
    # `raise_for_status` and a 30s start_period are not what the image had. Four
    # workers import the application four times, so the grace matters more here.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  db:
    # pgvector, not stock postgres: the RAG store runs
    # `CREATE EXTENSION IF NOT EXISTS vector` when a collection is first
    # written to, and on postgres:16-alpine that fails with
    # `extension "vector" is not available`.
    image: pgvector/pgvector:pg16
    container_name: agenticos_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-agenticos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port, and no egress: `data` is internal.
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: agenticos_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prefect-server:
    # Production had no Prefect at all, which meant document ingestion,
    # collection syncs and scheduled reports never ran: an upload was accepted
    # and the document stayed unsearchable forever.
    image: prefecthq/prefect:3-latest
    container_name: agenticos_prefect_server
    command: prefect server start --host 0.0.0.0
    volumes:
      - prefect_data:/root/.local/share/prefect/
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
      - PREFECT_SERVER_API_HOST=0.0.0.0
    # No published port: the UI is reached through the reverse proxy or an SSH
    # tunnel, not from the internet.
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prefect-runner:
    image: agenticos_backend:prod
    pull_policy: never
    container_name: agenticos_prefect_runner
    volumes:
      - media_data:/app/media
      - ./emails:/app/emails:ro
    command: python -m app.worker.prefect_app
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PREFECT_API_URL=http://prefect-server:4200/api
      # The runner's own health endpoint, started by app/worker/prefect_app.py.
      # Bound to the loopback because the same webserver serves `/shutdown`; see
      # docker-compose.yml.
      - PREFECT_RUNNER_SERVER_HOST=127.0.0.1
      - PREFECT_RUNNER_SERVER_PORT=8080
      # Empty unless the sandbox profile is up. Note what is absent from
      # this service: the Docker socket.
    # Egress too: ingestion calls an embedding provider.
    networks:
      - data
      - edge
    depends_on:
      prefect-server:
        condition: service_healthy
      db:
        condition: service_healthy
      app:
        condition: service_started
    # 503 once the runner has missed two polls; the start_period covers the
    # application import and the first poll. See docker-compose.yml.
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8080/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # The only service holding the Docker socket. See docker-compose.yml for the
  # reasoning; the differences here are that it is not on by default (mounting
  # the socket on a shared host is a deliberate act) and that the image tag is
  # pinned rather than tracking a minor.
  sandboxd:
    image: ghcr.io/vstorm-co/sandboxd:0.2
    container_name: agenticos_sandboxd_prod
    profiles: [sandbox]
    # The token comes from the same file every other secret in this stack comes
    # from, rather than through compose interpolation. Interpolation reads the
    # project root, not `backend/.env`, so a token generated where the
    # application reads it would have been invisible here - and every other
    # variable in this file carries a default precisely so the stack starts with
    # no env file at all. The service exits naming the variable when it is
    # missing, which `docker compose logs sandboxd` shows.
    env_file:
      - ./backend/.env
    environment:
      SANDBOXD_HOST: 0.0.0.0
      SANDBOXD_PORT: "8080"
      # Mounted at the same path on both sides, which is the only arrangement
      # that works: this service creates the directory and then asks the daemon
      # to bind-mount it, and the daemon resolves the path on the host. A named
      # volume, or any path that exists only in this container, is refused with
      # "mounts denied".
      #
      # The directory has to be writable by uid 10001 - `install -d -o 10001`
      # once, on the host - and it is where a conversation's files live, so it
      # belongs on storage somebody backs up.
      SANDBOXD_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}
      # Which environments an agent may ask for, and the only place they are
      # decided. `SANDBOXD_RUNTIMES` is `alias=image` or `alias=@recipe` in its
      # compact form; this is the JSON form, which is the only one that can name
      # a package list of its own - which is what `documents` needs.
      #
      # Adding one is an edit here and a restart, not a form in the product, and
      # that is upstream's decision rather than an omission: `PUT /policy`
      # changes ceilings and lifetimes at run time and deliberately refuses
      # `runtimes` membership, because naming an image is a decision about
      # isolation and the service token belongs to an application rather than to
      # whoever runs the host.
      #
      # Two things to know before editing it. **The first entry is the default**
      # for an agent whose spec names none. And `network_mode` is *not*
      # inherited: `SANDBOXD_NETWORK_MODE: none` below is the service-wide
      # default, so an entry that installs anything at run time has to say
      # `bridge` for itself - which `coding` and `polyglot` do, because
      # installing what a project declares is what they are for. The rest have
      # their packages baked in at build time and get no network at all.
      #
      # Restarting with a changed list rebuilds what it names: `prewarm` builds
      # every recipe as the service starts rather than inside somebody's first
      # request, which is minutes on a cold cache.
      SANDBOXD_RUNTIMES: >-
        {"coding": {"runtime": "coding", "network_mode": "bridge", "mem_limit": "1g",
        "description": "Python with git, ripgrep, fd, jq and uv - installs what a project declares"},
        "polyglot": {"runtime": "polyglot", "network_mode": "bridge", "mem_limit": "1g",
        "description": "Python and Node together, with curl and git"},
        "python": {"image": "python:3.12-slim", "description": "Python 3.12, standard library only"},
        "node": {"image": "node:20-slim", "description": "Node.js 20, no extra packages"},
        "documents": {"mem_limit": "4g", "description": "Read and write documents - LiteParse, pypdf, python-docx, openpyxl, Pillow",
        "runtime": {"name": "documents", "base_image": "python:3.12-slim",
        "description": "LiteParse, pypdf, python-docx, openpyxl and Pillow",
        "packages": ["liteparse", "pypdf", "python-docx", "openpyxl", "pillow"]}},
        "data": {"runtime": "python-analytics", "mem_limit": "4g",
        "description": "DuckDB and Polars - the same work as pandas in a third of the memory"}}
      SANDBOXD_PERSIST_CONTAINERS: "true"
      SANDBOXD_MAX_SESSIONS_PER_TENANT: "5"
      SANDBOXD_NETWORK_MODE: none
      SANDBOXD_UI_ENABLED: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}:${SANDBOX_WORKSPACE_ROOT:-/var/lib/agenticos/sandbox-workspaces}
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      # `data` only. `edge` is where the reverse proxy reaches the application,
      # and a service whose token can start containers on this host has no
      # business on a network anything outside can route to.
      - data
    restart: unless-stopped

networks:
  data:
    name: agenticos_data
    driver: bridge
    internal: true
  edge:
    name: agenticos_edge
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  prefect_data:
