# The browser's egress proxy: every page the deployment's browser loads goes
# out through here, and nothing inside the deployment's network is reachable.
#
# Squid resolves each host itself, checks the address below and connects to
# that address - so a name that answers public to one lookup and private to the
# next (DNS rebinding) cannot reach inside, which a check made before Chromium
# resolves the name again cannot promise.

http_port 3128

acl internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl internal dst 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15
acl internal dst 224.0.0.0/4 240.0.0.0/4
acl internal dst ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny internal
http_access allow all

# A forwarder, not a cache: pages are a person's session, not shared content.
# And no access log - it would be a list of every page a person's browse opened.
cache deny all
access_log none
